const SIGNAL_META = {

const STATE = {"daily": {"date": "09/07/2026", "dayOfWeek": "Quinta", "alert": "Dia fraco para notícias específicas de mobilidade por app no Brasil — nenhum item exclusivo das cidades-piloto nas últimas 24h. Ampliamos a janela para ~48h e incluímos um benchmark regional (TOUT, Goiânia) encontrado nesta rodada, publicado há cerca de 3 semanas, por forte aderência ao sprint de naming/posicionamento da DM.", "count": 6, "articles": [{"source": "A Tarde", "editoria": "Economia", "title": "Uber anuncia que milhões de motoristas podem ser substituídos por IA", "summary": "CEO da Uber projeta que o avanço de carros autônomos e IA pode substituir milhões de motoristas globalmente nos próximos anos. Sinal de que o maior concorrente já comunica ao mercado uma transição de longo prazo que reduz dependência de motorista humano — o oposto da aposta da vertical DM em captação de motorista no interior.", "url": "https://atarde.com.br/economia/uber-anuncia-que-milhoes-de-motoristas-podem-ser-substituidos-por-ia-1394368", "signals": ["concorrencia", "modelo", "captacao"]}, {"source": "Mix Vale", "editoria": "Economia", "title": "Carros por aplicativo vão acabar? Veja o impacto de uma possível regulamentação", "summary": "Propostas em tramitação no Congresso (linha do PLP 12/2024) criam a categoria de autônomo por plataforma, com piso de remuneração, contribuição ao INSS e limite de jornada para motoristas de Uber e 99. Se aprovado antes do lançamento da vertical DM (ago/2026), qualquer modelo de comissão ou mensalidade da plataforma pode ter que se adequar a um piso federal de remuneração.", "url": "https://www.mixvale.com.br/2026/07/08/carros-por-aplicativo-vao-acabar-veja-o-impacto-de-uma-possivel-regulamentacao/", "signals": ["regulacao", "modelo"]}, {"source": "Maringá Post", "editoria": "Cidade", "title": "Maringá terá pontos exclusivos para embarque e desembarque de carros por aplicativo", "summary": "A Câmara de Maringá (PR) aprovou projeto de lei que cria vagas exclusivas de embarque/desembarque para carros de app em pontos de maior movimento da cidade; falta sanção do prefeito. Mostra um caminho legislativo municipal que as cidades-piloto DM podem adotar — ou enfrentar — para regular a operação local de um app de corrida.", "url": "https://maringapost.com.br/2026/07/08/maringa-tera-pontos-exclusivos-para-embarque-e-desembarque-de-carros-por-aplicativo/", "signals": ["regulacao", "interior"]}, {"source": "Bom Dia Guarulhos", "editoria": "Cidades", "title": "Rio Preto conclui instalação de totens para embarque e desembarque", "summary": "São José do Rio Preto (SP) finalizou totens físicos que organizam áreas de parada rápida e servem de referência para passageiros e motoristas de app. Mais um precedente municipal de infraestrutura dedicada a corridas por aplicativo em cidade de interior de porte médio — tema que pode chegar às cidades-piloto DM.", "url": "https://bomdiaguarulhos.com.br/noticia/72967/rio-preto-conclui-instalacao-de-totens-para-embarque-e-desembarque", "signals": ["regulacao", "interior"]}, {"source": "Varginha Online", "editoria": "Cidades", "title": "Motociclista sem CNH que usava perfil falso em app de transporte é preso em Varginha", "summary": "A PM prendeu em Varginha (MG) um motociclista de 27 anos sem CNH que operava com perfil falso em app de transporte — a mesma cidade do caso Joice Batiston, que ainda repercute. Reforça que a verificação de identidade/documentação do motorista continua sendo uma falha real de segurança nos apps atuais, ponto que a vertical DM precisa blindar desde o desenho do cadastro.", "url": "https://www.varginhaonline.com.br/cidades/motociclista-perfil-falso-aplicativo-preso-varginha/", "signals": ["regulacao", "captacao"]}, {"source": "Jornal Opção", "editoria": "Transporte", "title": "Goiana lança aplicativo de transporte sem tarifa dinâmica e com categoria exclusiva para mulheres", "summary": "O TOUT, app 100% goiano com mais de 100 motoristas, chega ao mercado com taxa fixa de 15%, sem tarifa dinâmica, categoria exclusiva para mulheres e opção de favoritar motorista. Benchmark direto de naming/posicionamento regional (identidade local forte, sem 'car' no nome) e de modelo de comissão simples — descoberto nesta rodada, publicado há cerca de 3 semanas.", "url": "https://www.jornalopcao.com.br/ultimas-noticias/goiana-lanca-aplicativo-de-transporte-sem-tarifa-dinamica-e-com-categoria-exclusiva-para-mulheres-836955/", "signals": ["naming", "interior", "concorrencia", "modelo"]}]}, "weekly": {"weekOf": "29/06 – 06/07/2026", "count": 7, "articles": [{"source": "Extra (Globo)", "editoria": "Economia", "title": "Move Brasil: Banco do Brasil faz parceria com Uber para oferecer cashback em financiamentos", "summary": "BB e Uber lançaram cashback de até 3,5 parcelas para motoristas que financiarem carro novo pelo Move Brasil, condicionado ao cumprimento de corridas mensais. É o primeiro grande player empacotando crédito bancário + corrida como ferramenta de retenção — eleva o padrão de benefício financeiro que a DM precisa igualar para captar motorista já endividado com a concorrência.", "url": "https://extra.globo.com/economia/noticia/2026/06/move-brasil-banco-do-brasil-faz-parceria-com-uber-para-oferecer-cashback-em-financiamentos.ghtml", "signals": ["modelo", "captacao", "concorrencia"]}, {"source": "E-Commerce Brasil", "editoria": "Mercado", "title": "Após ABC Paulista, 99Compras inicia operação em Guarulhos", "summary": "A 99 expande a 99Compras (mercado e farmácia) para mais uma cidade da Grande SP, empilhando vertical sobre a base de motorista/entregador já capturada. É o espelho do movimento da DM (que parte do delivery para a corrida) — prova que cross-sell de vertical funciona quando já existe densidade de base.", "url": "https://www.ecommercebrasil.com.br/noticias/apos-abc-paulista-99compras-inicia-operacao-em-guarulhos", "signals": ["modelo", "concorrencia"]}, {"source": "G1", "editoria": "Política", "title": "Dosimetria, Uberização e mais: STF encerra semestre e casos de repercussão ficam para agosto", "summary": "O STF fechou o semestre sem julgar o vínculo empregatício de motoristas de app e remarcou o tema — agora com data mais concreta — para agosto/2026, exatamente o mês do deadline de naming e lançamento da vertical DM. A incerteza jurídica sobre comissão x mensalidade x vínculo vai conviver com o lançamento.", "url": "https://g1.globo.com/politica/noticia/2026/07/01/dosimetria-uberizacao-e-mais-stf-encerra-semestre-em-sessao-nesta-quarta-e-casos-de-repercussao-devem-ficar-para-agosto-veja-lista.ghtml", "signals": ["regulacao", "modelo"]}, {"source": "G1", "editoria": "São Paulo", "title": "Moraes derruba exigência de seguro ampliado para moto por aplicativo feita pela Prefeitura de SP", "summary": "O STF suspendeu decreto municipal que exigia seguro extra (até R$500 mil) para mototáxi por app em SP, por invasão de competência da União. Reduz risco regulatório municipal para operar moto via app — dado direto para a decisão 'incluir moto ou não' na vertical DM, ainda que o caso Joice Batiston (abaixo) mostre que o risco reputacional de segurança continua em aberto.", "url": "https://g1.globo.com/sp/sao-paulo/noticia/2026/06/30/moraes-derruba-exigencia-de-seguro-ampliado-para-moto-por-aplicativo-feita-pela-prefeitura-de-sp.ghtml", "signals": ["regulacao", "captacao"]}, {"source": "55 Content", "editoria": "Entrevista · Mercado", "title": "Ele queria trazer a Uber para cidade, mas acabou criando seu próprio app de mobilidade", "summary": "Fundador da Digmove (João Monlevade, MG) tentou apenas revender a marca Uber para a cidade, não conseguiu, e criou app próprio que hoje combina corrida urbana, viagens intermunicipais e locação. Mais um benchmark de app regional nascido da ausência dos players nacionais no interior — reforça que há demanda represada exatamente no segmento que a DM quer atacar.", "url": "https://55content.com.br/entrevista/ele-queria-trazer-a-uber-para-cidade-mas-acabou-criando-seu-proprio-app-de-mobilidade/", "signals": ["naming", "interior", "concorrencia", "modelo"]}, {"source": "G1", "editoria": "Sul de Minas", "title": "Protesto cobra justiça e respostas sobre a morte de jovem em Varginha (MG)", "summary": "Uma semana após a prisão do motociclista de app pela morte de Joice Batiston, familiares e amigos fizeram passeata cobrando justiça e mais segurança pública. O caso segue vivo na mídia — reforça que verificação e segurança do motorista de moto é tema sensível que ainda não esfriou, pesando contra incluir moto sem protocolo robusto de checagem.", "url": "https://g1.globo.com/mg/sul-de-minas/noticia/2026/06/29/protesto-cobra-justica-e-respostas-sobre-a-morte-de-jovem-em-varginha-mg.ghtml", "signals": ["regulacao", "captacao"]}, {"source": "TMC", "editoria": "Brasil", "title": "Uber Mulher chega a todo o Brasil com acesso para adolescentes", "summary": "Além da expansão nacional, a Uber ampliou o Uber Mulher para permitir uso por adolescentes, abrindo um novo segmento demográfico de captação de passageira. Mostra que os grandes players seguem fatiando o público por segurança percebida, não por preço — um approach replicável em escala menor no interior.", "url": "https://tmc.com.br/brasil/uber-mulher-expansao-nacional-brasil-adolescentes/", "signals": ["concorrencia", "modelo"]}], "analysis": {"naming": "Nenhum concorrente trocou de nome ou lançou rebranding esta semana, mas dois movimentos deslocam o eixo do território verbal. A Uber ampliou o Uber Mulher para todo o Brasil e agora também para adolescentes — reforçando que os grandes players seguem segmentando por segurança percebida e demografia, não por preço. E a Digmove (João Monlevade, MG) é mais um caso de app regional que nasceu porque a Uber não chegou: nome neutro, sem 'car', sem conotação de preço, hoje multi-serviço (urbano + intermunicipal + locação). É a quinta semana seguida em que o padrão se confirma sem exceção: nome curto, neutro e regional, sem 'car', vence no interior. O flanco 'Much Car = Muito Caro' continua sendo um erro evitável e, com a decisão de Moraes sobre seguro de mototáxi (abaixo) reduzindo barreira regulatória para moto, fica ainda mais claro que o nome não pode travar a entrada de duas rodas. Território recomendado: app local de confiança, neutro, que acomoda carro e moto — não uma sigla de 'carro'.", "captacao": "Três sinais claros esta semana, todos convergindo para o mesmo ponto: quem capta motorista hoje está comprando com crédito, não com marca. (1) Banco do Brasil e Uber lançaram cashback de até 3,5 parcelas para quem financia carro pelo Move Brasil e cumpre cota de corridas mensais — a Uber estruturou financiamento + corrida como ferramenta de retenção, elevando a régua do que significa 'benefício financeiro' para o motorista. (2) Moraes derrubou a exigência de seguro extra para mototáxi por app em São Paulo, reduzindo custo regulatório municipal para operar moto — abre uma janela, mas é restrita a SP e não elimina o risco de outros municípios tentarem o mesmo. (3) Uma semana depois, o caso Joice Batiston ainda gera protesto e cobrança pública — segurança da moto continua sendo tema de crise de imagem em aberto, não encerrado. Para a DM, a leitura é dura: sem crédito bancário casado à corrida, a arma de captação tem que ser comissão baixa/zero real ou mensalidade transparente, mais verificação de motorista como pré-requisito de entrada (não diferencial). A 99Compras em Guarulhos mostra o caminho inverso funcionando — vertical adicional sobre base capturada gera retenção —, o que valida a lógica da DM de plugar corrida dentro do app de delivery, desde que a oferta de motorista já exista antes de vender a promessa.", "tese": "A tese de 10% da base ativa em Cáceres pedindo corrida no 1º mês continua sem qualquer evidência empírica a favor nesta semana, e o cenário piorou em dois pontos concretos. Primeiro, o STF empurrou o julgamento do vínculo de motoristas de app exatamente para agosto/2026 — o mesmo mês do deadline de naming e lançamento da DM — o que significa lançar a vertical sem saber ainda se o modelo de comissão ou mensalidade vai sobreviver a uma eventual decisão de vínculo empregatício. Segundo, Banco do Brasil e Uber elevaram o custo de oportunidade de trocar de app: motorista que financiou carro pelo Move Brasil com cashback amarrado a cota de corridas mensais na Uber tem incentivo direto para concentrar corrida ali, não em um app novo e desconhecido. A única evidência a favor, fraca, é a Digmove: prova que existe demanda represada no interior onde grandes players não chegam — mas levou anos para construir escala, não 30 dias, e não há nenhum dado nesta ou nas semanas anteriores mostrando conversão de usuário de delivery em passageiro de corrida. Recomendação sem rodeio: manter 10% como meta de 90 dias, não de lançamento. Em Cáceres, sem concorrente regional forte mapeado e sem programa de crédito bancário concorrente amarrando motorista, a janela de oferta ainda existe — mas a métrica do primeiro mês tem que ser motoristas ativos e online por hora, não corridas solicitadas pela base."}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

function renderDaily() {
  const d = STATE.daily;
  if (!d || !d.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📭</div>
      <p>Nenhum clipping diário disponível ainda.</p>
    </div>`;
  }
  const alertClass = d.alert.toLowerCase().includes('nenhuma') ? '' : 'green';
  return `
    <div class="count-bar">
      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
