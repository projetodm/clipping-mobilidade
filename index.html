const SIGNAL_META = {

const STATE = {"daily": {"date": "30/06/2026", "dayOfWeek": "Terça", "alert": "Janela de 24-48h marcada pela economia do motorista e por apps regionais, não por lançamentos dos grandes. Destaques novos: dois apps regionais ganham visibilidade — Cidadela Transport (taxa fixa de 15%, corrida mínima de R$9,50) e a Driver City, nascida em Camaquã (RS) com 5 mil passageiros — ambos reforçando a tese de operação regional e o padrão de naming neutro. Sem lançamento ou nova vertical de player nacional nas últimas 24h; o único movimento de grande player é a parceria 99/GAC/GreenV para recarga rápida (5 dias), incluída pela regra de players. A pressão sobre o líquido do motorista volta ao centro (estudo do TST: gasto acima de R$5 mil/mês). Nenhuma menção direta às cidades-piloto; o caso de acidentes com motos de app em Recife mantém o tema segurança/moto em pauta para a decisão da vertical DM.", "count": 6, "articles": [{"source": "55 Content", "editoria": "Mercado · Concorrência", "title": "Cidadela Transport: novo app de mobilidade aposta em taxa fixa de 15% e corrida mínima de R$ 9,50", "summary": "Novo app regional se posiciona por impacto social/ambiental, com taxa fixa de 15% ao motorista e piso de R$9,50 por corrida. É mais um entrante regional disputando o motorista pela economia (taxa baixa e previsível) e por propósito — não por marca nacional. Para a DM, reforça que o eixo de captação é líquido transparente e que há espaço para naming neutro com propósito local.", "url": "https://55content.com.br/entrevista/ele-quer-unir-impacto-social-e-ambiental-em-app-de-mobilidade-com-taxa-fixa-de-15-e-corrida-minima-de-r-950/", "signals": ["concorrencia", "modelo", "naming"]}, {"source": "55 Content", "editoria": "Mercado · Interior", "title": "Driver City: app de mobilidade criado em Camaquã (RS) reúne 5 mil passageiros", "summary": "Plataforma fundada por filho de agricultores opera em Camaquã, no interior gaúcho, com 5 mil passageiros cadastrados. É outro app regional vingando no interior do RS — mesma UF de Santana do Livramento e Teutônia, cidades-piloto da DM. Confirma que o RS não é greenfield, que naming neutro/local funciona e serve de benchmark direto de tração para a vertical DM.", "url": "https://55content.com.br/entrevista/filho-de-agricultores-cria-aplicativo-de-mobilidade-durante-a-pandemia-e-reune-5-mil-passageiros-em-camaqua-rs/", "signals": ["concorrencia", "interior", "modelo", "naming"]}, {"source": "Motor1", "editoria": "Mercado · Concorrência", "title": "GAC, GreenV e 99 unem forças para criar nova rede de recarga rápida no Brasil", "summary": "A 99 firmou parceria para expandir a infraestrutura de recarga, com 242 pontos rápidos até 2030. Movimento estratégico da líder amarrando frota elétrica e custo de operação do motorista — vetor de fidelização de longo prazo que vai além da comissão por corrida. Incluído pela regra de players; sinaliza que os grandes competem cada vez mais por benefício ao motorista, terreno em que a DM precisa de resposta local.", "url": "https://motor1.uol.com.br/news/799686/parceria-gac-greenv-99/", "signals": ["concorrencia", "modelo"]}, {"source": "ND Mais", "editoria": "Política · Trabalho", "title": "Motorista de aplicativo gasta mais de R$ 5 mil por mês enquanto regulamentação segue parada", "summary": "Estudo do TST aponta gasto mensal acima de R$5 mil e precarização crescente, com a regulamentação travada. A economia apertada do motorista é o fator nº1 na decisão de para quem rodar — capta-se no líquido, não na marca. A DM precisa entrar com comissão/mensalidade transparente e demanda garantida pela base de delivery.", "url": "https://ndmais.com.br/politica/motorista-de-aplicativo-gasta-mais-de-r-5-mil-no-trabalho/", "signals": ["captacao", "regulacao"]}, {"source": "Crusoé", "editoria": "Cidades · Segurança", "title": "Acidentes com motoristas de aplicativo e passageiros representam 90% dos atendimentos do SAMU em Recife", "summary": "Levantamento aponta que sinistros com motos de app dominam os atendimentos do SAMU na capital pernambucana (mais de 55% dos acidentes envolvem motos). Reforça o risco reputacional e de segurança da corrida de moto — exatamente a vertical em decisão na DM. Verificação e protocolo de segurança são pré-requisito, não diferencial.", "url": "https://crusoe.com.br/variedades/acidentes-envolvendo-motoristas-de-aplicativos-e-passageiros-representam-90-dos-atendimentos-do-samu/", "signals": ["regulacao", "captacao"]}, {"source": "TV Pampa", "editoria": "Justiça · RS", "title": "Justiça gaúcha mantém bloqueio de motorista em aplicativo de transporte por conduta inadequada", "summary": "O TJRS confirmou a desativação do cadastro de um motorista por comportamento inadequado. Caso no RS — região das cidades-piloto — que mostra como a moderação e o bloqueio de motorista viram tema jurídico e de confiança da plataforma. A DM deve nascer com política clara de conduta e verificação para sustentar o território de 'app local em que você confia'.", "url": "https://www.tvpampa.com.br/comportamento-inadequado-justica-gaucha-mantem-bloqueio-de-motorista-em-aplicativo-de-transporte/", "signals": ["regulacao", "interior"]}]}, "weekly": {"weekOf": "22/06 – 29/06/2026", "count": 8, "articles": [{"source": "PR Newswire / Autodata", "editoria": "Mercado · Lançamento", "title": "inDrive lança categoria 'Táxi' em São Paulo com taxa ZERO para o motorista parceiro", "summary": "A inDrive entrou no transporte individual regulado (táxi) em SP cobrando taxa zero do motorista e prometendo preço mais competitivo ao usuário. É a líder global do 'preço justo' atacando a economia do motorista pelo extremo — taxa zero — e ocupando um território de naming que comunica confiança e regulação ('táxi'). Eleva a régua do líquido do motorista e mostra que o eixo verbal premiado agora é segurança/confiança, não só preço baixo.", "url": "https://www.prnewswire.com/br/comunicados-para-a-imprensa/indrive-lanca-categoria-taxi-na-cidade-de-sao-paulo-com-taxa-zero-para-motoristas-parceiros-302806597.html", "signals": ["concorrencia", "modelo", "naming"]}, {"source": "55 Content", "editoria": "Mercado · Concorrência", "title": "Tour Mobilidade, app regional do interior do PR, fecha maio com mais de 80 mil corridas/mês em 23 cidades", "summary": "Fundada em São Miguel do Iguaçu (PR), a Tour Mobilidade já opera em 23 cidades e faz ~80 mil corridas/mês — prova viva de que um app regional escala no interior sem marca nacional. Nome neutro ('Tour'), sem 'car' e sem conotação de preço. Benchmark direto para a DM: dá lastro à tese de operação regional, mas mostra que escala leva tempo e exige densidade de oferta — não veio em 30 dias.", "url": "https://55content.com.br/entrevista/ela-se-apaixonou-pela-vida-de-motorista-e-criou-um-app-de-mobilidade-fechamos-o-mes-de-maio-com-mais-de-80-mil-corridas/", "signals": ["concorrencia", "interior", "modelo", "naming"]}, {"source": "Alegrete Tudo", "editoria": "Região · Concorrência", "title": "Rota 77 é o único app de mobilidade credenciado ao Move em Alegrete (RS)", "summary": "Concorrente já mapeado (mensalidade, 100% da corrida pro motorista), o Rota 77 se tornou o único app credenciado ao Move Brasil em Alegrete — cidade da fronteira-oeste gaúcha, mesma região de Santana do Livramento. Credenciamento local vira ativo de captação: trava motorista que quer financiar carro. Confirma que o RS NÃO é greenfield e que parceria/credenciamento municipal pesa para captar quem já roda em concorrente.", "url": "https://www.alegretetudo.com.br/rota-77-e-o-unico-aplicativo-de-mobilidade-urbana-credenciado-ao-move-em-alegrete/", "signals": ["concorrencia", "interior", "captacao", "modelo"]}, {"source": "InvestNews", "editoria": "Economia · Crédito", "title": "Move Brasil entra em operação: corrida de R$30 bi das montadoras pelos motoristas de app (motos em julho)", "summary": "O programa federal de R$30 bi para financiar carros novos a motoristas e taxistas começou a operar, com montadoras (BYD, Peugeot) oferecendo descontos agressivos e linha para motos a partir de julho. Amplia o pool de motoristas, mas torna cada um mais seletivo e endividado — capta-se com previsibilidade de ganho, não com marca. A entrada de motos em julho reabre a decisão 'corrida de moto: incluir ou não' na vertical DM.", "url": "https://investnews.com.br/negocios/move-brasil-poe-montadoras-numa-corrida-de-r-30-bilhoes-pelos-motoristas-de-aplicativo/", "signals": ["captacao", "modelo", "regulacao"]}, {"source": "NeoFeed", "editoria": "Poder · Regulação", "title": "Governo prepara PL para regulamentar o trabalho por aplicativos, ratificando convenção da OIT", "summary": "O governo retoma a estratégia de regulamentar o trabalho em apps via projeto de lei alinhado à OIT. Risco jurídico de fundo do setor: o desfecho redefine a estrutura de custo da relação com o motorista (comissão x mensalidade x vínculo). A DM deve desenhar naming e modelo de motorista já prevendo cenário de maior formalização — não travar a tese num formato que a lei pode inviabilizar.", "url": "https://neofeed.com.br/poder/exclusivo-a-estrategia-do-governo-para-retomar-regulamentacao-do-trabalho-por-aplicativos-no-brasil/", "signals": ["regulacao", "modelo"]}, {"source": "Migalhas", "editoria": "Jurídico · Trabalho", "title": "STF adia para 2026 o julgamento sobre vínculo de motoristas de app (uberização)", "summary": "Fachin retirou o tema da pauta e o julgamento que definirá se há vínculo entre motorista e plataforma ficou sem nova data. Atualiza o clipping anterior ('STF retoma'): o risco está adiado, não resolvido. Janela de incerteza regulatória aberta durante toda a fase de lançamento da DM — fator a embutir no desenho contratual com o motorista.", "url": "https://www.migalhas.com.br/quentes/444822/stf-adia-para-2026-julgamento-sobre-vinculo-de-motoristas-de-app", "signals": ["regulacao", "modelo"]}, {"source": "G1 / UOL", "editoria": "Segurança · Cotidiano", "title": "Caso Joice Batiston: motociclista de app preso por morte de jovem em Varginha (MG)", "summary": "Jovem desapareceu e foi morta após pedir uma corrida de MOTO por aplicativo; o motociclista foi preso. Caso de grande repercussão nacional que joga luz sobre o risco reputacional e de segurança específico da corrida de moto — exatamente a vertical em decisão na DM. Reforça que verificação de motorista e segurança não são 'diferencial bonito', e sim pré-requisito; pesa contra incluir moto sem protocolo robusto de segurança.", "url": "https://g1.globo.com/mg/sul-de-minas/noticia/2026/06/25/caso-joice-batiston-prisao.ghtml", "signals": ["captacao", "regulacao"]}, {"source": "Correio 24 Horas", "editoria": "Economia · Fintech", "title": "Depois da corrida, vem o empréstimo: apps de mobilidade passam a lucrar também como bancos", "summary": "As plataformas passaram a oferecer crédito ao motorista logo após a corrida, transformando a relação financeira num motor de receita e retenção (mesma lógica do inDrive.Money). Mostra que o modelo de negócio do setor migra de 'comissão por corrida' para serviços financeiros sobre o motorista. Para a DM, é um vetor de fidelização a considerar — e um lembrete de que comissão pura é cada vez menos o jogo.", "url": "https://www.correio24horas.com.br/economia/depois-da-corrida-vem-o-emprestimo-como-os-aplicativos-passaram-a-lucrar-tambem-como-bancos-0626", "signals": ["modelo", "captacao"]}], "analysis": {"naming": "A semana endurece a recomendação central pela quarta vez seguida: nomes curtos, neutros e brasileiros, sem 'car', são os que andam no interior. A Tour Mobilidade (80 mil corridas/mês em 23 cidades do PR, nome neutro) e o Rota 77 (agora único app credenciado ao Move em Alegrete, fronteira-oeste do RS, vizinhança de Santana do Livramento) confirmam o padrão — marca neutra que acomoda carro E moto, zero conotação de preço. O flanco 'Much Car = Muito Caro' segue sendo um erro evitável. O movimento que muda o eixo do território veio da inDrive: ao lançar a categoria 'Táxi' em SP com taxa ZERO ao motorista, a líder global deslocou a conversa de 'preço baixo' para 'confiança e regulação' — 'táxi' comunica segurança. Some-se a isso o caso Joice Batiston (morte numa corrida de moto por app, repercussão nacional): segurança e verificação estão virando território de marca, não item de rodapé. Conclusão dura: o território vencedor para a DM no interior é 'o app local em que você confia' — nome neutro e regional, ancorado em segurança/verificação e em demanda já instalada pela base de delivery. Carimbar 'car' no nome desperdiça esse território e abre o flanco semântico de uma só vez.", "captacao": "Três forças se intensificaram, todas empurrando para o mesmo lugar: a captação se ganha no líquido do motorista e na segurança, nunca na marca. (1) O Move Brasil saiu do papel com força — R$30 bi, montadoras (BYD, Peugeot) com desconto agressivo e linha para motos a partir de julho. Amplia o pool, mas deixa o motorista mais endividado, mais seletivo e menos fiel — exclusividade fica mais cara de comprar. (2) A economia do motorista está apertada: estudo do CJST/TST aponta gasto acima de R$5 mil/mês e precarização crescente; quem decide para quem rodar olha renda líquida primeiro. (3) O eixo competitivo do líquido foi puxado ao extremo: a inDrive lançou táxi com taxa ZERO, enquanto Rota 77 (100% da corrida) e credenciamento local já travam motorista no RS. Em paralelo, o modelo migra para serviços financeiros (crédito ao motorista pós-corrida) como ferramenta de retenção. Leitura para a DM: a arma de captação é (a) bater no bolso — comissão baixa/zero ou mensalidade transparente, possivelmente com crédito/benefício financeiro; (b) entregar o que o white-label sozinho não dá — demanda garantida no dia 1 vinda da base DM; e (c) segurança/verificação como critério de entrada, agora mandatório após o caso de moto em MG. Risco novo: governo prepara PL alinhado à OIT e o STF adiou o julgamento da uberização para 2026 — a estrutura de custo da relação com o motorista pode mudar no meio do projeto. Desenhe o contrato prevendo formalização.", "tese": "A tese de 10% da base ativa em Cáceres pedindo corrida no 1º mês continua AGRESSIVA, e a semana traz o primeiro contraponto empírico relevante — mas ele não salva o prazo. A FAVOR: a Tour Mobilidade prova que um app regional escala no interior sem marca nacional (80 mil corridas/mês, 23 cidades) e a inDrive valida o cross-sell de serviços sobre uma base. CONTRA, e mais pesado: (1) a própria Tour levou tempo e é uma marca dedicada de mobilidade — não converteu uma base de delivery em corrida em 30 dias; segue sem QUALQUER evidência, nesta semana, de que usuário de delivery vira passageiro de corrida na casa de 10% em um mês. (2) O gargalo é oferta, não demanda: Rota 77 credenciado ao Move em Alegrete (vizinha de Santana do Livramento) trava motorista localmente, e a inDrive com taxa zero aumenta a concorrência pelo motorista justamente quando o Move o deixa mais endividado e seletivo. (3) Liquidez de oferta no dia 1 — motorista online suficiente para tempo de espera competitivo — é o que define o sucesso, e nada na semana indica que isso esteja garantido nas cidades-piloto. Recomendação sem rodeio: 10% no mês 1 confunde awareness com conversão e ignora densidade de motorista. Trate 10% como meta de 90 dias. Em Cáceres (MT) — sem concorrente regional forte mapeado, ao contrário do RS — há janela melhor para garantir OFERTA primeiro; a métrica de lançamento tem de ser motoristas online por hora, e só então acionar a base de demanda."}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

function renderDaily() {
  const d = STATE.daily;
  if (!d || !d.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📭</div>
      <p>Nenhum clipping diário disponível ainda.</p>
    </div>`;
  }
  const alertClass = d.alert.toLowerCase().includes('nenhuma') ? '' : 'green';
  return `
    <div class="count-bar">
      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
