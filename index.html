<!DOCTYPE html><script type="application/json" id="cowork-artifact-meta">
{
  "name": "Mobilidade Clipping Dm",
  "schemaVersion": 1
}
</script>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobilidade por App — Clipping DM</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f5f7;
    color: #1a1a2e;
    min-height: 100vh;
    padding: 20px 18px;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .header p  { font-size: 12px; color: #a0aec0; margin-top: 4px; }
  .cities { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .city-tag {
    background: rgba(99,179,237,0.2); color: #90cdf4;
    font-size: 11px; padding: 2px 7px; border-radius: 20px;
  }

  /* TABS */
  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: #e8eaed;
    border-radius: 10px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    color: #718096;
  }
  .tab-btn.active {
    background: #fff;
    color: #1a1a2e;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* COUNT BAR */
  .count-bar {
    background: #fff;
    border-radius: 8px;
    padding: 9px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    color: #718096;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #e2e8f0;
  }
  .count-bar strong { color: #1a1a2e; }

  /* ALERT */
  .alert-bar {
    background: #fffde7;
    border: 1px solid #f9e04b;
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 12px;
    color: #7d6608;
    margin-bottom: 14px;
  }
  .alert-bar.green {
    background: #f0fff4; border-color: #9ae6b4; color: #276749;
  }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.07); }
  .card-header {
    padding: 13px 16px 0;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .source { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #718096; letter-spacing: 0.5px; }
  .dot { color: #cbd5e0; font-size: 10px; }
  .editoria { font-size: 11px; color: #a0aec0; }
  .card-body { padding: 9px 16px 13px; }
  .card-body h2 { font-size: 14px; font-weight: 600; line-height: 1.4; color: #1a202c; margin-bottom: 7px; }
  .card-body p  { font-size: 13px; line-height: 1.6; color: #4a5568; margin-bottom: 8px; }
  .card-footer {
    padding: 9px 16px 13px;
    border-top: 1px solid #f0f0f0;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .signals { display: flex; gap: 5px; flex-wrap: wrap; }
  .signal { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }
  .s-naming      { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
  .s-regulacao   { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
  .s-captacao    { background: #fffaf0; color: #c05621; border: 1px solid #fbd38d; }
  .s-modelo      { background: #ebf8ff; color: #2b6cb0; border: 1px solid #90cdf4; }
  .s-interior    { background: #faf5ff; color: #6b46c1; border: 1px solid #d6bcfa; }
  .s-concorrencia{ background: #fff0f6; color: #97266d; border: 1px solid #fbb6ce; }
  .read-link { font-size: 12px; color: #4299e1; text-decoration: none; font-weight: 500; }
  .read-link:hover { text-decoration: underline; }

  /* WEEKLY ANALYSIS */
  .week-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: #a0aec0; margin: 18px 0 8px;
  }
  .analysis-block {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    padding: 16px;
    margin-bottom: 10px;
  }
  .analysis-block h3 {
    font-size: 13px; font-weight: 700; color: #2d3748;
    margin-bottom: 8px; display: flex; align-items: center; gap: 7px;
  }
  .analysis-block p {
    font-size: 13px; line-height: 1.6; color: #4a5568; white-space: pre-wrap;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 40px 20px;
    background: #fff; border-radius: 10px; border: 1px solid #e2e8f0;
  }
  .empty-state p { font-size: 13px; color: #a0aec0; margin-top: 8px; }

  .footer {
    margin-top: 18px; text-align: center;
    font-size: 11px; color: #a0aec0;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🚗 Mobilidade por App — Clipping DM</h1>
    <p>Projeto Mobilidade · Delivery Much · <span id="header-date"></span></p>
    <div class="cities">
      <span class="city-tag">📍 Cáceres</span>
      <span class="city-tag">📍 Santana do Livramento</span>
      <span class="city-tag">📍 Barreiras</span>
      <span class="city-tag">📍 Teutônia</span>
    </div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('daily')">📰 Diário</button>
  <button class="tab-btn" onclick="switchTab('weekly')">📊 Semanal + Análise</button>
</div>

<!-- DAILY TAB -->
<div id="tab-daily" class="tab-panel active"></div>

<!-- WEEKLY TAB -->
<div id="tab-weekly" class="tab-panel"></div>

<div class="footer">Atualizado automaticamente · DM Mobilidade Intelligence</div>

<script>
const SIGNAL_META = {
  naming:       { label: 'Naming/posicionamento', cls: 's-naming' },
  concorrencia: { label: 'Concorrência local',    cls: 's-concorrencia' },
  regulacao:    { label: 'Regulação',             cls: 's-regulacao' },
  interior:     { label: 'Interior/cidades-piloto', cls: 's-interior' },
  captacao:     { label: 'Captação de motorista', cls: 's-captacao' },
  modelo:       { label: 'Modelo de negócio',     cls: 's-modelo' }
};

const STATE = {"daily":{"date":"12/06/2026","dayOfWeek":"Sexta","alert":"Sem menções diretas às cidades-piloto (Cáceres, Santana do Livramento, Barreiras e Teutônia) nas últimas 24h. O dia é dominado pela economia do motorista: o programa federal Move Brasil/Move Aplicativos entra em vigor e já reduz o preço de quase 40 modelos para motoristas de app e taxistas, com desdobramentos chegando ao interior (Patrocínio-MG, feirões em SP). Em paralelo, cidades pequenas regulamentam o transporte por moto-app (Arcoverde-PE/99Moto) e surge nova frente de regulação estadual (PL em Goiás) — sinais diretos para o modelo de captação e o enquadramento jurídico da vertical DM.","count":6,"articles":[{"source":"A Tarde","editoria":"Autos · Mobilidade","title":"Programa Move Brasil: quase 40 carros têm preço reduzido por benefício","summary":"Linha federal de R$ 30 bi reduz o preço de 38 modelos para motoristas de app e taxistas. Muda diretamente a economia de aquisição/troca de veículo do motorista — variável central no custo de operar e na atratividade de qualquer plataforma, inclusive no plano de captação da vertical DM.","url":"https://atarde.com.br/autos/programa-move-brasil-quase-40-carros-tem-preco-reduzido-por-beneficio-1391941","signals":["captacao","modelo","regulacao"]},{"source":"Nill Júnior","editoria":"Cidade · Interior PE","title":"Cadastramento para plataformas como 99Moto vai até 19 de junho em Arcoverde","summary":"A autarquia de trânsito de Arcoverde (PE) regulamenta o transporte por aplicativo em motocicletas e abre cadastro de motoristas. Exemplo concreto de como cidades do interior estão criando regras locais para app de corrida/moto — precedente direto para a entrada da DM nas cidades-piloto.","url":"https://nilljunior.com.br/cadastramento-para-plataformas-como-99moto-vai-ate-19-de-junho-em-arcoverde/","signals":["interior","regulacao","concorrencia"]},{"source":"CartaCapital","editoria":"Política · Economia","title":"Governo vai lançar linha de crédito para entregadores de aplicativo financiarem motos novas","summary":"Crédito com garantia do FGO, prazo de até 48 meses e desconto de montadoras para entregadores comprarem moto nova. Reforça a tese de que o poder público está subsidiando o ativo de trabalho do motorista/entregador — fator que pesa no perfil e no custo de captação da base.","url":"https://www.cartacapital.com.br/politica/governo-vai-lancar-linha-de-credito-para-entregadores-de-aplicativo-financiarem-motos-novas/","signals":["captacao","modelo"]},{"source":"AutoData","editoria":"Mobility · Negócios","title":"Startup Vô Contigo oferece serviço de mobilidade para público 60+","summary":"Nova plataforma se posiciona em um nicho específico (32-34 mi de brasileiros com 60+) em vez de competir de frente com Uber/99. Caso útil de naming e posicionamento por nicho — exatamente o tipo de diferenciação que a DM busca ao plugar mobilidade ao app existente.","url":"https://www.autodata.com.br/mobility/2026/06/11/startup-vo-contigo-oferece-servico-de-mobilidade-para-publico-60/105971/","signals":["concorrencia","modelo","naming"]},{"source":"Novo Momento","editoria":"Economia · Mobilidade","title":"Crise da Uber/99: atrasos respondem por 49% dos cancelamentos","summary":"Levantamento aponta padrão recorrente de ineficiência (atraso e cancelamento) nos grandes apps em São Paulo. Mostra a abertura de espaço por insatisfação com os líderes — argumento de posicionamento para alternativas regionais e de proximidade como a proposta da DM no interior.","url":"https://novomomento.com.br/crise-uber-99-atrasos-respondem-49-cancelamento/","signals":["concorrencia","modelo"]},{"source":"O Xadrez da Política","editoria":"Política · Goiás","title":"Dr. George Morais projeta inclusão para motoristas e entregadores por aplicativo","summary":"PL nº 8899/26 quer instituir a Política Estadual 'Dignidade sobre Rodas' em Goiás, voltada a motoristas e entregadores de app. Indica avanço da regulação estadual sobre direitos e condições dos trabalhadores de plataforma — pano de fundo a monitorar para o enquadramento e o discurso de captação da DM.","url":"https://oxadrezdapolitica.com.br/dr-george-morais-projeta-inclusao-para-motoristas-e-entregadores-por-aplicativo/","signals":["regulacao","captacao"]}]},"weekly":{"weekOf":"","count":0,"articles":[],"analysis":{"naming":"","captacao":"","tese":""}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

function renderDaily() {
  const d = STATE.daily;
  if (!d || !d.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📭</div>
      <p>Nenhum clipping diário disponível ainda.</p>
    </div>`;
  }
  const alertClass = d.alert.toLowerCase().includes('nenhuma') ? '' : 'green';
  return `
    <div class="count-bar">
      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
