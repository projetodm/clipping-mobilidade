const STATE = {"daily": {"date": "24/06/2026", "dayOfWeek": "Quarta", "alert": "Sem menção direta às cidades-piloto nas últimas 24h. O dia é dominado por uma onda regulatória e de subsídio ao motorista: o Move Brasil entrou em operação (calculadora do GLOBO simula a parcela por modelo), o TST alertou para o risco de endividamento do motorista, a Câmara avançou com a corrida de moto por app e o Senado e a Comissão de Segurança Pública avançaram em novas regras de proteção. No campo dos players, a 99 fechou parceria com a Automob (maior grupo de concessionárias do país) para subsidiar carro novo + cashback — movimento estratégico de captação incluído por regra obrigatória.", "count": 6, "articles": [{"source": "99 (institucional)", "editoria": "Concorrência · Captação", "title": "99 fecha parceria com a Automob para oferecer carro novo com desconto e cashback a motoristas em SP e MA", "summary": "A 99 anunciou parceria com a Automob, maior grupo de concessionárias do Brasil: motoristas aprovados no Move Brasil compram veículo com até 17% de desconto e ganham R$250 de cashback ao bater 250 corridas/mês (por até 12 meses). É a líder usando subsídio de ativo + bônus de volume para travar exclusividade do motorista — eleva a régua de captação que a DM terá de enfrentar mesmo no interior.", "url": "https://www.instagram.com/reel/DZ8RTLxBPf8/", "signals": ["concorrencia", "captacao", "modelo"]}, {"source": "O Globo", "editoria": "Economia · Mobilidade", "title": "Move Brasil: calculadora do GLOBO simula a parcela de cada modelo para motoristas de app e táxi", "summary": "Com o Move Brasil em operação (lançado em maio), o GLOBO publicou calculadora que simula a parcela de financiamento por modelo de carro 0km para motorista de app. O subsídio federal baixa o custo do ativo de trabalho e amplia o pool de motoristas — mas torna cada um mais seletivo sobre para qual app roda, pressionando a captação da DM nas cidades-piloto.", "url": "https://oglobo.globo.com/economia/noticia/2026/06/24/move-brasil-qual-carro-cabe-no-seu-bolso-calculadora-do-globo-simula-parcela-de-cada-modelo-para-motoristas-de-app-e-taxi.ghtml", "signals": ["captacao", "modelo"]}, {"source": "CUT / TST", "editoria": "Trabalho · Economia", "title": "Motoristas de app têm maior risco de endividamento, alerta TST", "summary": "Pesquisa do Tribunal Superior do Trabalho aponta que motoristas de aplicativo estão mais vulneráveis ao endividamento, com custos de manutenção e dívidas inesperadas corroendo a renda. Reforça que, no interior, a arma de captação é a renda líquida do motorista — comissão baixa/zero e previsibilidade pesam mais que marca na decisão de para qual app rodar.", "url": "https://www.cut.org.br/noticias/motoristas-de-app-tem-maior-risco-de-endividamento-alerta-tst-0356/amp", "signals": ["captacao", "regulacao"]}, {"source": "Congresso em Foco", "editoria": "Política · Regulação", "title": "Projeto que libera corridas de moto por aplicativo avança na Câmara", "summary": "A Comissão de Viação e Transportes aprovou proposta que autoriza o transporte remunerado de passageiros por motocicleta via app em todo o país, alterando a Política Nacional de Mobilidade. Decisão direta sobre a tese da DM: se a corrida de moto for liberada nacionalmente, muda o cálculo de incluir (ou não) moto na vertical — relevante para ticket e liquidez de oferta no interior.", "url": "https://www.congressoemfoco.com.br/noticia/119910/projeto-que-libera-corridas-de-moto-por-aplicativo-avanca-na-camara", "signals": ["regulacao", "modelo", "captacao"]}, {"source": "Revista Security", "editoria": "Regulação · Segurança", "title": "Projeto que impõe novas regras para apps de transporte avança no Senado", "summary": "Avança no Senado projeto que altera regras de pagamento, identificação de passageiros e monitoramento de viagens, redesenhando o cenário regulatório do setor. Para a DM, é mais um sinal de que verificação e segurança deixam de ser diferencial e viram exigência — argumento de captação e item obrigatório de produto antes do lançamento.", "url": "https://revistasecurity.com.br/projeto-que-impoe-novas-regras-para-apps-de-transporte-avanca-no-senado/", "signals": ["regulacao", "modelo"]}, {"source": "Câmara dos Deputados", "editoria": "Política · Segurança", "title": "Comissão aprova regras para aumentar a proteção de motoristas de aplicativo (PL 6370/25)", "summary": "A Comissão de Segurança Pública aprovou o PL 6370/25, que garante ao motorista, antes de aceitar a corrida, acesso ao endereço completo, ao nome do passageiro e à quantidade de paradas, além de botão de emergência. Segurança e transparência migram de diferencial para padrão regulatório — a DM precisa nascer com esses recursos para não entrar em desvantagem.", "url": "https://www.camara.leg.br/noticias/1284129-comissao-aprova-regras-para-aumentar-protecao-de-motoristas-de-aplicativo/", "signals": ["regulacao", "captacao"]}]}, "weekly": {"weekOf": "15/06 – 22/06/2026", "count": 8, "articles": [{"source": "Gazeta do Povo", "editoria": "Economia · Trabalho", "title": "STF retoma julgamento da 'uberização' e pode mudar as regras do vínculo de motoristas de aplicativo", "summary": "O STF voltou a julgar se motoristas de app têm vínculo de emprego com as plataformas — decisão de repercussão nacional que pode redesenhar a estrutura de custo de qualquer operação de mobilidade. Para a DM, é risco jurídico de fundo: o modelo de relação com o motorista (comissão x mensalidade) precisa ser desenhado já antevendo um cenário de maior formalização.", "url": "https://www.gazetadopovo.com.br/economia/uber-stf-julga-vinculo-motoristas-aplicativo-uberizacao/", "signals": ["regulacao", "modelo"]}, {"source": "InDrive (institucional)", "editoria": "Mercado · Super App", "title": "InDrive consolida estratégia de super app no Brasil: Corridas, Cidade a Cidade, Entregas e inDrive.Money num só app", "summary": "A inDrive empacota corridas, viagens intermunicipais, entregas e serviços financeiros (inDrive.Money) sob um único app — 'um app, muitos serviços'. É a mesma tese da DM (vertical plugada numa base existente) sendo executada por um player global. Sinal de que a janela do 'super app de serviços locais' está fechando rápido e a DM precisa cravar o interior antes que ela desça para lá.", "url": "https://www.instagram.com/p/DZpPqiolUDh/", "signals": ["concorrencia", "modelo"]}, {"source": "55 Content", "editoria": "Mercado · Lançamento", "title": "App TAZZ é lançado com planos de assinatura de R$24,90 a R$99,90 ao motorista, sobre tecnologia white-label da Machine", "summary": "Novo entrante TAZZ estreia cobrando mensalidade escalonada do motorista (R$24,90 / 49,90 / 99,90) usando a mesma stack white-label Machine que a DM avalia. Mostra que o modelo de assinatura segue sendo a aposta padrão de novos apps — e que a tecnologia da DM não é diferencial por si só; o diferencial tem de vir de base de demanda e marca.", "url": "https://55content.com.br/entrevista/empreendedor-testa-aplicativo-de-mobilidade-sem-taxa-para-motoristas-vou-ganhar-fazendo-publicidade/", "signals": ["concorrencia", "modelo", "naming"]}, {"source": "UP TV / Uilian News", "editoria": "Região · Concorrência", "title": "Garupa expande 'Garupa Assinatura' em São Gabriel (RS) com promessa de corrida mais barata ao usuário", "summary": "O Garupa avança no interior gaúcho com um plano de assinatura para o usuário ('corridas em economia real'), em cidade vizinha a Santana do Livramento. Naming neutro, sem conotação de preço, que acomoda carro e moto — exatamente o tipo de território que evita o flanco 'Much Car = Muito Caro'. Concorrente direto avançando na fronteira da cidade-piloto da DM no RS.", "url": "https://www.facebook.com/uiliannews/posts/1568210514913992/", "signals": ["concorrencia", "naming", "modelo", "interior"]}, {"source": "Andaê (institucional)", "editoria": "Região · Concorrência", "title": "Andaê reforça captação de motoristas no Vale do Taquari, região de Teutônia", "summary": "O app regional Andaê está em campanha ativa de captação de motoristas no Vale do Taquari — exatamente onde fica Teutônia, cidade-piloto da DM. Confirma que a cidade-piloto gaúcha NÃO é greenfield: há concorrente regional já fidelizando a oferta de motoristas localmente. Liquidez de oferta no dia 1 é o gargalo, não a demanda.", "url": "https://www.instagram.com/p/DZqhxqFRH1n/", "signals": ["concorrencia", "interior", "captacao"]}, {"source": "Câmara dos Deputados / Ágora ES", "editoria": "Política · Segurança", "title": "Comissão da Câmara aprova projeto que aumenta a proteção de motoristas de aplicativo", "summary": "A Comissão de Segurança Pública aprovou PL com novas medidas de segurança para motoristas de app. Some-se aos PLs municipais de transporte por app (Gravatá-PE, Natal-RN) na mesma semana. Segurança e verificação deixam de ser 'diferencial bonito' e viram critério de escolha e exigência regulatória — argumento que a DM pode usar para atrair motoristas que rodam em apps sem proteção robusta.", "url": "https://agoraes.com.br/noticia/41899/comissao-aprova-regras-para-aumentar-protecao-de-motoristas-de-aplicativo", "signals": ["regulacao", "captacao"]}, {"source": "55 Content", "editoria": "Produto · Concorrência", "title": "Uber passa a exibir todas as paradas no mapa antes da aceitação da corrida", "summary": "A Uber libera ao motorista a visão de todas as paradas antes de aceitar a corrida — melhoria de transparência que mexe na experiência e na retenção do motorista. Movimento da líder no eixo 'satisfação do motorista'; eleva a régua de produto que qualquer entrante regional precisa, no mínimo, igualar.", "url": "https://55content.com.br/noticia/uber-passa-a-exibir-todas-as-paradas-no-mapa-antes-da-aceitacao-da-corrida/", "signals": ["concorrencia", "captacao"]}, {"source": "Banco do Brasil / Brasil 247", "editoria": "Economia · Crédito", "title": "Bancos iniciam contratações do Move Brasil e ampliam crédito para motoristas de app e taxistas", "summary": "Entrou em operação a contratação do Move Brasil (carros e, em julho, motos), com juros a partir de 0,91% ao mês. O Estado está baixando o custo de entrada do motorista — amplia o pool, mas torna o motorista mais seletivo e com mais poder de barganha. Pesa direto na captação da DM e na decisão de incluir (ou não) corrida de moto na vertical.", "url": "https://www.brasil247.com/economia/banco-do-brasil-inicia-contratacoes-e-amplia-credito-para-taxistas-e-motoristas-de-aplicativo", "signals": ["captacao", "modelo", "regulacao"]}], "analysis": {"naming": "A semana confirma um padrão único no interior: os nomes que avançam são curtos, neutros e brasileiros, e nenhum deles depende de 'car'. Garupa (expandindo o 'Garupa Assinatura' em São Gabriel, a um passo de Santana do Livramento), Andaê (captando no Vale do Taquari, onde fica Teutônia) e o recém-lançado TAZZ jogam todos no mesmo território verbal: marca neutra, sem conotação de preço, que acomoda carro E moto. Isso reforça pela terceira semana seguida a recomendação central — fugir do eixo 'Car/caro'. O flanco 'Much Car = Muito Caro' não é teórico; com Garupa e Andaê cercando as cidades-piloto do RS com nomes neutros, a DM entraria em desvantagem semântica imediata se carimbasse 'car' no nome. O movimento que muda o jogo veio da inDrive: ela está empacotando corridas, intermunicipal, entregas e serviços financeiros (inDrive.Money) num super app único — 'um app, muitos serviços'. É a tese da DM (vertical plugada na base) sendo executada por um player global. Conclusão dura: o território 'o app de tudo da sua cidade' está sendo ocupado de cima para baixo. A DM tem uma vantagem que a inDrive não tem no interior — base local de delivery já instalada — mas precisa cravar esse posicionamento agora, com um nome neutro e regional, antes que o super app desça.", "captacao": "Duas forças estruturais se intensificaram. (1) O Move Brasil saiu do papel: bancos já contratam financiamento de carro (e motos em julho) a 0,91% ao mês. Isso amplia o pool de motoristas, mas o efeito colateral é claro — motorista com ativo subsidiado fica mais seletivo e com mais poder de barganha sobre para quem roda. (2) A pressão regulatória subiu de patamar: o STF retomou o julgamento da 'uberização' (vínculo de emprego) e a Comissão de Segurança Pública da Câmara aprovou novas regras de proteção ao motorista, acompanhadas de PLs municipais (Gravatá, Natal). Leitura direta: no interior, a arma de captação é economia líquida do motorista somada a segurança — não marca. Garupa (taxa zero / assinatura), Rota 77 (100% da corrida) e TAZZ (mensalidade de R$24,90) já disputam o líquido; a DM precisa ganhar em dois vetores ao mesmo tempo: (a) bater no bolso — comissão baixa/zero ou mensalidade transparente; e (b) entregar o que o concorrente white-label não tem — demanda garantida no dia 1 vinda da base DM, mais verificação/segurança como critério, agora que pesquisa da semana mostra que o usuário valoriza escolher o motorista por segurança. Risco novo e concreto: dependendo do desfecho no STF, a estrutura de custo da relação com o motorista pode mudar no meio do projeto — o naming/posicionamento deve ser desenhado já prevendo formalização.", "tese": "A tese de 10% da base ativa em Cáceres pedindo corrida no 1º mês é AGRESSIVA, e a semana pende mais contra do que a favor. A favor (1 sinal estrutural forte): a inDrive provou, ao empacotar corridas + entregas + financeiro num super app, que cross-sell de mobilidade sobre uma base existente é o caminho dominante do mercado — valida a arquitetura da tese DM. Contra (sinais duros): primeiro, o interior NÃO é greenfield e está esquentando AGORA — Garupa em São Gabriel (vizinha de Santana do Livramento), Andaê captando motoristas no Vale do Taquari (Teutônia), Rota 77 e TAZZ em expansão. A restrição não é demanda; é liquidez de oferta — motorista online suficiente para tempo de espera competitivo no dia 1. Segundo, o Move Brasil aumenta a oferta nacional de motoristas, mas torna cada motorista mais disputado e menos fiel — mais difícil de travar com exclusividade. Terceiro, segue sem qualquer evidência, nesta semana, de que usuário de delivery converte para corrida na casa de 10% em 30 dias; adjacência de categoria não é equivalência de comportamento. Recomendação sem rodeio: 10% no 1º mês confunde awareness com conversão e ignora o gargalo real (densidade de motorista). Trate 10% como meta de 90 dias, não de mês 1. Em Cáceres especificamente — sem concorrente regional forte mapeado, ao contrário do RS — há janela melhor para garantir oferta primeiro; mas a métrica de lançamento tem de ser motoristas online por hora, e só depois acionar a base de demanda."}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
