<script>
const SIGNAL_META = {

const STATE = {"daily": {"date": "03/07/2026", "dayOfWeek": "Sexta", "alert": "Dia fraco em novidades diretas de naming, interior ou lançamentos de players: nenhum movimento estratégico novo de Uber, 99, InDrive, Garupa, Rota 77 ou similares nas últimas 24h (a expansão nacional do Uber Mulher voltou a aparecer, mas já constava em edições anteriores e não foi repetida). Ampliamos a janela para ~48h e priorizamos crédito ao motorista (Move Brasil), precificação dinâmica na Copa e um benchmark forte de app regional no Ceará.", "count": 4, "articles": [{"source": "NC News", "editoria": "Brasil · Mobilidade", "title": "Crédito travado e táxi-lotação expõem impasse na mobilidade", "summary": "O Move Brasil (R$30 bi via BNDES) segue travado pelos bancos mesmo após o fundo garantidor entrar em operação em 1º/7; em paralelo, SP discute um \"Selo Táxi Seguro e Inclusivo\" e Rio Branco (AC) libera táxi-lotação a R$5 diante do colapso do ônibus. Confirma que crédito ao motorista e segurança seguem sendo o gargalo real do setor, não a marca do app — ponto central para o desenho de captação e branding da vertical DM.", "url": "https://ncnews.com.br/2026/07/03/credito-travado-e-taxi-lotacao-expoem-impasse-na-mobilidade/", "signals": ["regulacao", "captacao"]}, {"source": "55content", "editoria": "Entrevista · Mercado", "title": "Após perder mercado para a Uber, empreendedor cearense reconstrói negócio com aplicativo regional", "summary": "O fundador do Black Passageiro (interior do Ceará) relata como reconstruiu o negócio após ser engolido pela chegada da Uber, hoje rodando ~600 corridas/dia e R$300 mil/mês em municípios pequenos, com categorias enxutas (popular, premium, moto) e captação via tráfego pago e influenciadores. Ele descreve a chegada recente da 99 dando corridas grátis para roubar mercado — benchmark direto e atual para a tese de naming, categorias e captação de motorista da vertical DM no interior.", "url": "https://55content.com.br/entrevista/apos-perder-mercado-para-a-uber-empreendedor-cearense-reconstroi-negocio-com-aplicativo-regional/", "signals": ["naming", "interior", "concorrencia", "modelo"]}, {"source": "Jornal do Brás", "editoria": "Motor & Cia", "title": "Corre Certo lança plano especial para motoristas da Move Brasil e aposta na eletrificação do transporte por aplicativo", "summary": "Associação de proteção veicular lança plano com 25% de desconto e pré-cadastro para motoristas aprovados no Move Brasil, incluindo cobertura específica para carros elétricos e híbridos. Mostra que o ecossistema em torno do crédito ao motorista (seguro, proteção veicular) já está se organizando comercialmente — um vetor de captação e fidelização que a DM pode empacotar junto ao lançamento da vertical nas cidades-piloto.", "url": "https://jornaldobras.com.br/noticia/128445/corre-certo-lanca-plano-especial-para-motoristas-da-move-brasil-e-aposta-na-eletrificacao-do-transporte-por-aplicativo/amp", "signals": ["captacao", "modelo"]}, {"source": "Rádio Itatiaia", "editoria": "Economia", "title": "Preços em apps de transporte sobem até 200% com jogos do Brasil na Copa do Mundo", "summary": "Levantamento em Belo Horizonte mostra corridas por app subindo até 201% em horários de jogo do Brasil na Copa; Uber e 99 se posicionaram via nota da Amobitec defendendo o preço dinâmico como equilíbrio entre demanda e oferta de motoristas. Confirma que precificação dinâmica é prática normalizada e defendida pelo setor — ponto a calibrar no desenho tarifário da DM para não gerar percepção negativa em picos de demanda no interior.", "url": "https://www.itatiaia.com.br/economia/precos-em-apps-de-transporte-sobem-ate-200-com-jogos-do-brasil-na-copa-do-mundo/", "signals": ["concorrencia", "modelo"]}]}, "weekly": {"weekOf": "22/06 – 29/06/2026", "count": 8, "articles": [{"source": "PR Newswire / Autodata", "editoria": "Mercado · Lançamento", "title": "inDrive lança categoria 'Táxi' em São Paulo com taxa ZERO para o motorista parceiro", "summary": "A inDrive entrou no transporte individual regulado (táxi) em SP cobrando taxa zero do motorista e prometendo preço mais competitivo ao usuário. É a líder global do 'preço justo' atacando a economia do motorista pelo extremo — taxa zero — e ocupando um território de naming que comunica confiança e regulação ('táxi'). Eleva a régua do líquido do motorista e mostra que o eixo verbal premiado agora é segurança/confiança, não só preço baixo.", "url": "https://www.prnewswire.com/br/comunicados-para-a-imprensa/indrive-lanca-categoria-taxi-na-cidade-de-sao-paulo-com-taxa-zero-para-motoristas-parceiros-302806597.html", "signals": ["concorrencia", "modelo", "naming"]}, {"source": "55 Content", "editoria": "Mercado · Concorrência", "title": "Tour Mobilidade, app regional do interior do PR, fecha maio com mais de 80 mil corridas/mês em 23 cidades", "summary": "Fundada em São Miguel do Iguaçu (PR), a Tour Mobilidade já opera em 23 cidades e faz ~80 mil corridas/mês — prova viva de que um app regional escala no interior sem marca nacional. Nome neutro ('Tour'), sem 'car' e sem conotação de preço. Benchmark direto para a DM: dá lastro à tese de operação regional, mas mostra que escala leva tempo e exige densidade de oferta — não veio em 30 dias.", "url": "https://55content.com.br/entrevista/ela-se-apaixonou-pela-vida-de-motorista-e-criou-um-app-de-mobilidade-fechamos-o-mes-de-maio-com-mais-de-80-mil-corridas/", "signals": ["concorrencia", "interior", "modelo", "naming"]}, {"source": "Alegrete Tudo", "editoria": "Região · Concorrência", "title": "Rota 77 é o único app de mobilidade credenciado ao Move em Alegrete (RS)", "summary": "Concorrente já mapeado (mensalidade, 100% da corrida pro motorista), o Rota 77 se tornou o único app credenciado ao Move Brasil em Alegrete — cidade da fronteira-oeste gaúcha, mesma região de Santana do Livramento. Credenciamento local vira ativo de captação: trava motorista que quer financiar carro. Confirma que o RS NÃO é greenfield e que parceria/credenciamento municipal pesa para captar quem já roda em concorrente.", "url": "https://www.alegretetudo.com.br/rota-77-e-o-unico-aplicativo-de-mobilidade-urbana-credenciado-ao-move-em-alegrete/", "signals": ["concorrencia", "interior", "captacao", "modelo"]}, {"source": "InvestNews", "editoria": "Economia · Crédito", "title": "Move Brasil entra em operação: corrida de R$30 bi das montadoras pelos motoristas de app (motos em julho)", "summary": "O programa federal de R$30 bi para financiar carros novos a motoristas e taxistas começou a operar, com montadoras (BYD, Peugeot) oferecendo descontos agressivos e linha para motos a partir de julho. Amplia o pool de motoristas, mas torna cada um mais seletivo e endividado — capta-se com previsibilidade de ganho, não com marca. A entrada de motos em julho reabre a decisão 'corrida de moto: incluir ou não' na vertical DM.", "url": "https://investnews.com.br/negocios/move-brasil-poe-montadoras-numa-corrida-de-r-30-bilhoes-pelos-motoristas-de-aplicativo/", "signals": ["captacao", "modelo", "regulacao"]}, {"source": "NeoFeed", "editoria": "Poder · Regulação", "title": "Governo prepara PL para regulamentar o trabalho por aplicativos, ratificando convenção da OIT", "summary": "O governo retoma a estratégia de regulamentar o trabalho em apps via projeto de lei alinhado à OIT. Risco jurídico de fundo do setor: o desfecho redefine a estrutura de custo da relação com o motorista (comissão x mensalidade x vínculo). A DM deve desenhar naming e modelo de motorista já prevendo cenário de maior formalização — não travar a tese num formato que a lei pode inviabilizar.", "url": "https://neofeed.com.br/poder/exclusivo-a-estrategia-do-governo-para-retomar-regulamentacao-do-trabalho-por-aplicativos-no-brasil/", "signals": ["regulacao", "modelo"]}, {"source": "Migalhas", "editoria": "Jurídico · Trabalho", "title": "STF adia para 2026 o julgamento sobre vínculo de motoristas de app (uberização)", "summary": "Fachin retirou o tema da pauta e o julgamento que definirá se há vínculo entre motorista e plataforma ficou sem nova data. Atualiza o clipping anterior ('STF retoma'): o risco está adiado, não resolvido. Janela de incerteza regulatória aberta durante toda a fase de lançamento da DM — fator a embutir no desenho contratual com o motorista.", "url": "https://www.migalhas.com.br/quentes/444822/stf-adia-para-2026-julgamento-sobre-vinculo-de-motoristas-de-app", "signals": ["regulacao", "modelo"]}, {"source": "G1 / UOL", "editoria": "Segurança · Cotidiano", "title": "Caso Joice Batiston: motociclista de app preso por morte de jovem em Varginha (MG)", "summary": "Jovem desapareceu e foi morta após pedir uma corrida de MOTO por aplicativo; o motociclista foi preso. Caso de grande repercussão nacional que joga luz sobre o risco reputacional e de segurança específico da corrida de moto — exatamente a vertical em decisão na DM. Reforça que verificação de motorista e segurança não são 'diferencial bonito', e sim pré-requisito; pesa contra incluir moto sem protocolo robusto de segurança.", "url": "https://g1.globo.com/mg/sul-de-minas/noticia/2026/06/25/caso-joice-batiston-prisao.ghtml", "signals": ["captacao", "regulacao"]}, {"source": "Correio 24 Horas", "editoria": "Economia · Fintech", "title": "Depois da corrida, vem o empréstimo: apps de mobilidade passam a lucrar também como bancos", "summary": "As plataformas passaram a oferecer crédito ao motorista logo após a corrida, transformando a relação financeira num motor de receita e retenção (mesma lógica do inDrive.Money). Mostra que o modelo de negócio do setor migra de 'comissão por corrida' para serviços financeiros sobre o motorista. Para a DM, é um vetor de fidelização a considerar — e um lembrete de que comissão pura é cada vez menos o jogo.", "url": "https://www.correio24horas.com.br/economia/depois-da-corrida-vem-o-emprestimo-como-os-aplicativos-passaram-a-lucrar-tambem-como-bancos-0626", "signals": ["modelo", "captacao"]}], "analysis": {"naming": "A semana endurece a recomendação central pela quarta vez seguida: nomes curtos, neutros e brasileiros, sem 'car', são os que andam no interior. A Tour Mobilidade (80 mil corridas/mês em 23 cidades do PR, nome neutro) e o Rota 77 (agora único app credenciado ao Move em Alegrete, fronteira-oeste do RS, vizinhança de Santana do Livramento) confirmam o padrão — marca neutra que acomoda carro E moto, zero conotação de preço. O flanco 'Much Car = Muito Caro' segue sendo um erro evitável. O movimento que muda o eixo do território veio da inDrive: ao lançar a categoria 'Táxi' em SP com taxa ZERO ao motorista, a líder global deslocou a conversa de 'preço baixo' para 'confiança e regulação' — 'táxi' comunica segurança. Some-se a isso o caso Joice Batiston (morte numa corrida de moto por app, repercussão nacional): segurança e verificação estão virando território de marca, não item de rodapé. Conclusão dura: o território vencedor para a DM no interior é 'o app local em que você confia' — nome neutro e regional, ancorado em segurança/verificação e em demanda já instalada pela base de delivery. Carimbar 'car' no nome desperdiça esse território e abre o flanco semântico de uma só vez.", "captacao": "Três forças se intensificaram, todas empurrando para o mesmo lugar: a captação se ganha no líquido do motorista e na segurança, nunca na marca. (1) O Move Brasil saiu do papel com força — R$30 bi, montadoras (BYD, Peugeot) com desconto agressivo e linha para motos a partir de julho. Amplia o pool, mas deixa o motorista mais endividado, mais seletivo e menos fiel — exclusividade fica mais cara de comprar. (2) A economia do motorista está apertada: estudo do CJST/TST aponta gasto acima de R$5 mil/mês e precarização crescente; quem decide para quem rodar olha renda líquida primeiro. (3) O eixo competitivo do líquido foi puxado ao extremo: a inDrive lançou táxi com taxa ZERO, enquanto Rota 77 (100% da corrida) e credenciamento local já travam motorista no RS. Em paralelo, o modelo migra para serviços financeiros (crédito ao motorista pós-corrida) como ferramenta de retenção. Leitura para a DM: a arma de captação é (a) bater no bolso — comissão baixa/zero ou mensalidade transparente, possivelmente com crédito/benefício financeiro; (b) entregar o que o white-label sozinho não dá — demanda garantida no dia 1 vinda da base DM; e (c) segurança/verificação como critério de entrada, agora mandatório após o caso de moto em MG. Risco novo: governo prepara PL alinhado à OIT e o STF adiou o julgamento da uberização para 2026 — a estrutura de custo da relação com o motorista pode mudar no meio do projeto. Desenhe o contrato prevendo formalização.", "tese": "A tese de 10% da base ativa em Cáceres pedindo corrida no 1º mês continua AGRESSIVA, e a semana traz o primeiro contraponto empírico relevante — mas ele não salva o prazo. A FAVOR: a Tour Mobilidade prova que um app regional escala no interior sem marca nacional (80 mil corridas/mês, 23 cidades) e a inDrive valida o cross-sell de serviços sobre uma base. CONTRA, e mais pesado: (1) a própria Tour levou tempo e é uma marca dedicada de mobilidade — não converteu uma base de delivery em corrida em 30 dias; segue sem QUALQUER evidência, nesta semana, de que usuário de delivery vira passageiro de corrida na casa de 10% em um mês. (2) O gargalo é oferta, não demanda: Rota 77 credenciado ao Move em Alegrete (vizinha de Santana do Livramento) trava motorista localmente, e a inDrive com taxa zero aumenta a concorrência pelo motorista justamente quando o Move o deixa mais endividado e seletivo. (3) Liquidez de oferta no dia 1 — motorista online suficiente para tempo de espera competitivo — é o que define o sucesso, e nada na semana indica que isso esteja garantido nas cidades-piloto. Recomendação sem rodeio: 10% no mês 1 confunde awareness com conversão e ignora densidade de motorista. Trate 10% como meta de 90 dias. Em Cáceres (MT) — sem concorrente regional forte mapeado, ao contrário do RS — há janela melhor para garantir OFERTA primeiro; a métrica de lançamento tem de ser motoristas online por hora, e só então acionar a base de demanda."}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

function renderDaily() {
  const d = STATE.daily;
  if (!d || !d.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📭</div>
      <p>Nenhum clipping diário disponível ainda.</p>
    </div>`;
  }
  const alertClass = d.alert.toLowerCase().includes('nenhuma') ? '' : 'green';
  return `
    <div class="count-bar">
      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
