const STATE = {"daily": {"date": "18/06/2026", "dayOfWeek": "Quinta", "alert": "Sem menções diretas às cidades-piloto (Cáceres, Santana do Livramento, Barreiras e Teutônia) nas últimas 24h — mas o radar regional capturou a Rota 77 crescendo em Lucas do Rio Verde (MT), mesmo estado de Cáceres. O dia tem dois movimentos quentes de players: a Uber colocou em teste o 'Passe para Motoristas' (cobrança única, motorista fica com 100% da corrida) — ou seja, a líder global flertando com o modelo de assinatura que a DM avalia — e o app regional Prime Move estreou em Itaberaí (GO) com taxa zero até o fim de 2026. No eixo regulatório/captação, o STF marcou julgamento sobre vínculo de emprego de motoristas e Piauí seguiu o ES com isenção de IPVA/ICMS, enquanto o Move Aplicativos (BNDES) registra demanda 'gigantesca'.", "count": 6, "articles": [{"source": "Uber (blog oficial)", "editoria": "Mobilidade · Modelo de negócio", "title": "Conheça o Passe para Motoristas: novo jeito de dirigir com o app da Uber", "summary": "A Uber testa um 'Passe' com cobrança única que deixa o motorista com 100% do valor das viagens no período — na prática, um modelo de assinatura no lugar da comissão por corrida. Movimento estratégico da líder global que valida exatamente o debate 'mensalidade vs comissão' que a DM enfrenta no naming/modelo. Se a Uber adota assinatura, o argumento de 'taxa zero' dos regionais perde parte do diferencial.", "url": "https://www.uber.com/br/pt-br/blog/passe-motorista/", "signals": ["concorrencia", "modelo", "captacao"]}, {"source": "55 Content", "editoria": "Entrevista · Mobilidade", "title": "App criado por ex-motorista não cobra taxas até o fim de 2026 (Prime Move, Itaberaí-GO)", "summary": "A Prime Move estreou em Itaberaí (GO) com taxa zero ao motorista até o fim de 2026 e discurso de valorização do profissional. Mais um app regional de interior nascendo no modelo 'sem comissão' — benchmark direto de naming neutro e de estratégia de captação por economia líquida do motorista, exatamente o terreno que a DM disputa nas cidades-piloto.", "url": "https://55content.com.br/entrevista/app-criado-por-ex-motorista-nao-cobra-taxas-ate-o-fim-de-2026/", "signals": ["naming", "modelo", "interior", "concorrencia"]}, {"source": "Terra MT Digital", "editoria": "Região · Mobilidade", "title": "Rota 77 cresce em Lucas do Rio Verde e aposta em mobilidade prática para o dia a dia", "summary": "A Rota 77, app regional, ganha tração em Lucas do Rio Verde (MT) — mesmo estado de Cáceres, cidade-piloto da DM. Sinaliza que o interior de MT já tem player local consolidando base de motoristas e usuários; a DM entra num mercado com concorrência regional ativa, não em greenfield. Monitorar modelo e cobertura da Rota 77 no estado.", "url": "https://terramtdigital.com.br/regiao/lucas-do-rio-verde/rota-77-cresce-em-lucas-do-rio-verde-e-aposta-em-mobilidade-pratica-para-o-dia-a-dia/", "signals": ["interior", "concorrencia", "modelo"]}, {"source": "Valor Econômico", "editoria": "Legislação · Trabalho", "title": "STF analisará vínculo de emprego de motoristas com aplicativos de transporte", "summary": "O STF vai decidir se motoristas têm vínculo de emprego com Uber e demais plataformas — julgamento que pode redefinir o custo e o enquadramento jurídico de toda operação de mobilidade no país. Variável regulatória de primeira ordem para a estrutura de receita e de relação com motorista da vertical DM.", "url": "https://valor.globo.com/google/amp/legislacao/noticia/2026/06/18/stf-analisara-trabalho-para-aplicativos-de-transporte.ghtml", "signals": ["regulacao", "modelo"]}, {"source": "Itatiaia", "editoria": "Economia · Mobilidade", "title": "Piauí e Espírito Santo dão isenção de IPVA e ICMS para motoristas comprarem carros", "summary": "O Piauí segue o ES e isenta IPVA/ICMS na compra de veículo por motorista de app e taxista. A onda de incentivos estaduais barateia o ativo de trabalho e tende a se espalhar (MT, RS, BA das cidades-piloto). Reduz custo de entrada do motorista, amplia o pool — e eleva o poder de barganha de quem a DM quer captar.", "url": "https://www.itatiaia.com.br/brasil/brasil-geral/motoristas-de-app-e-de-taxi-terao-isencao-de-ipva-e-de-icms-para-compra-de-carros-eletricos/", "signals": ["regulacao", "captacao"]}, {"source": "Mercado&Consumo", "editoria": "Economia · Crédito", "title": "Programa de crédito Move Aplicativos para motorista de app tem demanda 'gigantesca', diz Mercadante (BNDES)", "summary": "O presidente do BNDES afirma que a linha Move Aplicativos, que financia veículo para motorista de app e taxista, tem procura 'gigantesca'. Confirma forte apetite de novos motoristas por entrar no setor com custo de ativo subsidiado — oferta potencial crescente para captação, mas com expectativa de remuneração líquida mais alta no discurso da DM.", "url": "https://mercadoeconsumo.com.br/17/06/2026/economia/programa-de-credito-para-motorista-de-app-e-taxi-tem-demanda-gigantesca-diz-mercadante/amp/", "signals": ["captacao", "modelo"]}]}, "weekly": {"weekOf": "09/06 – 15/06/2026", "count": 8, "articles": [{"source": "55 Content", "editoria": "Entrevista · Negócios", "title": "Resenha Car: app do interior de MG cobra 15% do motorista, ticket médio R$14 e mínima de R$20,99 na madrugada", "summary": "App regional nascido em Paraopeba (interior MG) opera com modelo de comissão (15%), não mensalidade, com ticket médio baixo. Prova viva de que naming com 'Car' funciona no interior quando ancorado em proximidade/comunidade ('Resenha') — e que comissão enxuta é viável como alternativa à mensalidade dos rivais locais. Benchmark direto para naming e modelo da DM.", "url": "https://55content.com.br/entrevista/com-ticket-medio-de-r-14-resenha-car-cobra-15-dos-motoristas-de-app-e-tem-corrida-minima-de-r-2099-na-madrugada/", "signals": ["naming", "modelo", "concorrencia", "interior"]}, {"source": "CreativosBR / 99", "editoria": "Mercado · Mobilidade", "title": "99 lança campanha para consolidar 'SuperApp' entre motoristas e testa 99Compras no ABC Paulista", "summary": "A 99 reforça sua identidade de SuperApp e começa a testar o 99Compras (entrega de itens do dia a dia dentro do app). É exatamente a tese da DM — vertical plugada numa base existente — sendo executada pela líder. Sinal de que a janela de 'app único de serviços locais' está fechando rápido; a DM precisa ocupar o interior antes que o SuperApp da 99 chegue lá.", "url": "https://creativosbr.com.br/99-lanca-campanha-para-consolida-superapp-entre-motoristas-parceiros/", "signals": ["concorrencia", "modelo"]}, {"source": "Jornal do Brás", "editoria": "Economia · Mobilidade", "title": "Usuários da 99 crescem 15% em um ano e chegam a mais de 60 milhões no Brasil", "summary": "Base da 99 cresce e estrutura interna se expande (+200% em contratações 2024→2025). A líder está consolidando, não desacelerando — qualquer entrante regional disputa um mercado em que o incumbente investe pesado. Reforça que a vantagem da DM precisa vir da base própria e da proximidade local, não de preço isolado.", "url": "https://jornaldobras.com.br/noticia/125717/usuarios-da-99-crescem-15-em-um-ano-e-chegam-a-mais-de-60-milhoes-no-brasil", "signals": ["concorrencia", "modelo"]}, {"source": "Google Play / Garupa", "editoria": "Mercado · Concorrência", "title": "Garupa avança como 'maior app 100% brasileiro' com taxa zero ao motorista e assinatura de R$4,99/mês ao usuário", "summary": "Garupa combina taxa zero para o motorista (todo o valor da corrida) com uma assinatura barata para o usuário — território verbal neutro, sem conotação de preço e que acomoda carro e moto. Concorrente direto no modelo 'mensalidade/assinatura' que a DM avalia. O naming 'Garupa' é exatamente o tipo de saída que evita o flanco 'Much Car = Muito Caro'.", "url": "https://play.google.com/store/apps/details?id=co.garupa.driver", "signals": ["naming", "modelo", "captacao", "concorrencia"]}, {"source": "Gov.br · Secretaria-Geral", "editoria": "Governo · Mobilidade Produtiva", "title": "Governo lança Move Brasil Entregadores e MotoApp para compra de motos e bicicletas fabricadas no Brasil", "summary": "Nova frente do Move Brasil subsidia o ativo de trabalho de entregadores e motoristas de moto-app. Junto ao crédito para carros, o Estado está baixando o custo de entrada do motorista — amplia o pool, mas eleva expectativas e poder de barganha. Pesa direto na estratégia de captação e na decisão de incluir corrida de moto na vertical DM.", "url": "https://www.gov.br/secretariageral/pt-br/noticias/2026/junho/governo-do-brasil-lanca-move-brasil-entregadores-e-motoapp-para-compra-de-motos-e-bicicletas-fabricadas-no-brasil", "signals": ["captacao", "modelo", "regulacao"]}, {"source": "RFI Brasil", "editoria": "Internacional · Trabalho", "title": "OIT aprova primeiro tratado global sobre trabalho em plataformas; 2 milhões de brasileiros podem se beneficiar", "summary": "A OIT adotou o primeiro tratado internacional para proteger trabalhadores de aplicativos. Sinaliza pressão crescente por formalização, direitos e seguros — fator de custo e de enquadramento jurídico para qualquer operação de mobilidade nova, inclusive a da DM. Captação no interior terá de incorporar discurso de segurança e proteção do motorista.", "url": "https://www.rfi.fr/br/europa/20260612-oit-aprova-tratado-global-sobre-aplicativos-2-milh%C3%B5es-de-trabalhadores-poder%C3%A3o-se-beneficiar-no-brasil", "signals": ["regulacao", "captacao"]}, {"source": "Vermelho / Agência Brasil", "editoria": "Política · Transporte", "title": "Lula sanciona novo Marco Legal do Transporte Público Coletivo Urbano", "summary": "Nova lei muda financiamento, contratação, qualidade e preço do transporte coletivo. Embora foque no coletivo, redesenha o ambiente regulatório da mobilidade urbana em que o app de corrida opera — contexto a monitorar para o posicionamento da DM frente a poder público municipal nas cidades-piloto.", "url": "https://vermelho.org.br/2026/06/15/lula-sanciona-lei-que-muda-as-regras-do-transporte-publico-no-brasil/", "signals": ["regulacao", "modelo"]}, {"source": "Record / R7 · G1", "editoria": "Segurança · Interior", "title": "Onda de violência contra motoristas de app no interior de SP (corridas falsas, sequestro e latrocínio)", "summary": "Múltiplos casos na semana (Campinas, Rio Preto): sequestro em corrida falsa e motorista morto em latrocínio. Insegurança é barreira real de captação no interior e abre espaço para diferenciação por verificação/segurança — argumento que a DM pode usar para atrair motoristas que já rodam em apps sem proteção robusta.", "url": "https://record.r7.com/balanco-geral-manha/video/motorista-de-aplicativo-e-sequestrado-e-espancado-durante-corrida-falsa-em-campinas-sp-11062026/", "signals": ["interior", "captacao"]}], "analysis": {"naming": "A semana fortalece duas conclusões sobre o território de marca para o interior. Primeira: 'Car' não é necessariamente fatal. O Resenha Car (interior de MG) opera com 'Car' no nome sem evocar 'caro' porque ancora a marca em proximidade e comunidade ('resenha'). Ou seja, o problema do 'Much Car = Muito Caro' não é a palavra 'Car' isolada — é a colagem com 'Much/Muito'. Segunda, e mais forte: os modelos vencedores no interior usam território verbal neutro que acomoda carro E moto. O Garupa — que se posiciona como 'maior app 100% brasileiro' — é o melhor benchmark da semana: nome neutro, sem conotação de preço, que funciona para carro e moto e ainda carrega brasilidade. Recomendação reforçada: fugir do eixo 'Car/caro', priorizar um nome curto, regional e neutro que não trave a corrida de moto. Movimento que muda o jogo: a 99 está consolidando publicamente a marca 'SuperApp' (com 99Compras em teste) — a tese de 'app único de serviços' que a DM defende já está sendo apropriada pela líder. A janela de posicionamento como 'o app de tudo da sua cidade' está se fechando; a DM precisa cravar esse território no interior antes que o SuperApp da 99 desça para lá.", "captacao": "Duas mudanças estruturais na semana. (1) O Estado está subsidiando o ativo de trabalho do motorista: Move Brasil (carros, ~40 modelos com desconto) somado ao novo Move Brasil Entregadores e MotoApp (crédito para motos/bikes nacionais). Isso amplia o pool de motoristas, mas também eleva expectativa e poder de barganha — motorista com custo de veículo subsidiado é mais seletivo sobre para quem roda. (2) Pressão de formalização subindo: a OIT aprovou o primeiro tratado global de trabalho em plataformas (2 mi de brasileiros) e o novo Marco Legal do Transporte Público foi sancionado. Conclusão direta: no interior, a arma de captação é economia líquida do motorista, não marca. Rota 77, Pop69 e Garupa já disputam nesse eixo (100% da corrida / taxa zero / mensalidade). Para tirar motorista que já roda em concorrente local, a DM tem de ganhar em dois vetores simultâneos: (a) bater no líquido — comissão baixa/zero ou mensalidade transparente, e o Resenha Car prova que 15% de comissão é viável no interior; e (b) entregar o que o rival white-label não tem — a base instalada da DM como demanda garantida no dia 1. Risco novo e concreto: a onda de violência contra motoristas no interior de SP (corridas falsas, sequestro, latrocínio) transforma segurança/verificação de 'diferencial bonito' em critério de escolha do motorista. Quem oferecer verificação de passageiro e protocolo de segurança leva motorista.", "tese": "A tese de 10% da base ativa em Cáceres pedindo corrida no 1º mês é AGRESSIVA — a semana pesa mais contra do que a favor. A favor (1 sinal forte): a 99 provou que cross-sell de mobilidade dentro de um app de base existente funciona em escala (SuperApp + 99Compras), o que valida estruturalmente a tese 'plugar mobilidade na base DM'. Contra (dois sinais duros): primeiro, o interior NÃO é greenfield — Rota 77, Pop69, Garupa e Resenha Car já operam com bases de motoristas fidelizadas e preço agressivo; a restrição não é demanda, é liquidez de oferta (motorista online suficiente para tempo de espera competitivo no dia 1). Segundo, não há nenhuma evidência nesta semana de que usuário de delivery converte para corrida na casa de 10% em 30 dias — adjacência de categoria não é equivalência de comportamento. Leitura honesta e crítica: 10% no 1º mês confunde awareness com conversão e ignora o gargalo real, que é densidade de motorista. Se a DM não garantir oferta suficiente em Cáceres desde o lançamento, a demanda dos 10% evapora após a primeira experiência de espera longa. Recomendação: tratar 10% como meta de 90 dias, não de mês 1; instrumentar o lançamento por liquidez de oferta primeiro (quantos motoristas online por hora), e só então acionar a base de demanda."}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

function renderDaily() {

      <div style="font-size:32px">📭</div>

    </div>`;

  const alertClass = d.alert.toLowerCase().includes('nenhuma') ? '' : 'green';
  return `
    <div class="count-bar">
      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
