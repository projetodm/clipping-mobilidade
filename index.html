<script>
const SIGNAL_META = {
  naming:       { label: 'Naming/posicionamento', cls: 's-naming' },
  concorrencia: { label: 'Concorrência local',    cls: 's-concorrencia' },

const STATE = {"daily":{"date":"12/06/2026","dayOfWeek":"Sexta","alert":"Sem menções diretas às cidades-piloto (Cáceres, Santana do Livramento, Barreiras e Teutônia) nas últimas 24h. O dia é dominado pela economia do motorista: o programa federal Move Brasil/Move Aplicativos entra em vigor e já reduz o preço de quase 40 modelos para motoristas de app e taxistas, com desdobramentos chegando ao interior (Patrocínio-MG, feirões em SP). Em paralelo, cidades pequenas regulamentam o transporte por moto-app (Arcoverde-PE/99Moto) e surge nova frente de regulação estadual (PL em Goiás) — sinais diretos para o modelo de captação e o enquadramento jurídico da vertical DM.","count":6,"articles":[{"source":"A Tarde","editoria":"Autos · Mobilidade","title":"Programa Move Brasil: quase 40 carros têm preço reduzido por benefício","summary":"Linha federal de R$ 30 bi reduz o preço de 38 modelos para motoristas de app e taxistas. Muda diretamente a economia de aquisição/troca de veículo do motorista — variável central no custo de operar e na atratividade de qualquer plataforma, inclusive no plano de captação da vertical DM.","url":"https://atarde.com.br/autos/programa-move-brasil-quase-40-carros-tem-preco-reduzido-por-beneficio-1391941","signals":["captacao","modelo","regulacao"]},{"source":"Nill Júnior","editoria":"Cidade · Interior PE","title":"Cadastramento para plataformas como 99Moto vai até 19 de junho em Arcoverde","summary":"A autarquia de trânsito de Arcoverde (PE) regulamenta o transporte por aplicativo em motocicletas e abre cadastro de motoristas. Exemplo concreto de como cidades do interior estão criando regras locais para app de corrida/moto — precedente direto para a entrada da DM nas cidades-piloto.","url":"https://nilljunior.com.br/cadastramento-para-plataformas-como-99moto-vai-ate-19-de-junho-em-arcoverde/","signals":["interior","regulacao","concorrencia"]},{"source":"CartaCapital","editoria":"Política · Economia","title":"Governo vai lançar linha de crédito para entregadores de aplicativo financiarem motos novas","summary":"Crédito com garantia do FGO, prazo de até 48 meses e desconto de montadoras para entregadores comprarem moto nova. Reforça a tese de que o poder público está subsidiando o ativo de trabalho do motorista/entregador — fator que pesa no perfil e no custo de captação da base.","url":"https://www.cartacapital.com.br/politica/governo-vai-lancar-linha-de-credito-para-entregadores-de-aplicativo-financiarem-motos-novas/","signals":["captacao","modelo"]},{"source":"AutoData","editoria":"Mobility · Negócios","title":"Startup Vô Contigo oferece serviço de mobilidade para público 60+","summary":"Nova plataforma se posiciona em um nicho específico (32-34 mi de brasileiros com 60+) em vez de competir de frente com Uber/99. Caso útil de naming e posicionamento por nicho — exatamente o tipo de diferenciação que a DM busca ao plugar mobilidade ao app existente.","url":"https://www.autodata.com.br/mobility/2026/06/11/startup-vo-contigo-oferece-servico-de-mobilidade-para-publico-60/105971/","signals":["concorrencia","modelo","naming"]},{"source":"Novo Momento","editoria":"Economia · Mobilidade","title":"Crise da Uber/99: atrasos respondem por 49% dos cancelamentos","summary":"Levantamento aponta padrão recorrente de ineficiência (atraso e cancelamento) nos grandes apps em São Paulo. Mostra a abertura de espaço por insatisfação com os líderes — argumento de posicionamento para alternativas regionais e de proximidade como a proposta da DM no interior.","url":"https://novomomento.com.br/crise-uber-99-atrasos-respondem-49-cancelamento/","signals":["concorrencia","modelo"]},{"source":"O Xadrez da Política","editoria":"Política · Goiás","title":"Dr. George Morais projeta inclusão para motoristas e entregadores por aplicativo","summary":"PL nº 8899/26 quer instituir a Política Estadual 'Dignidade sobre Rodas' em Goiás, voltada a motoristas e entregadores de app. Indica avanço da regulação estadual sobre direitos e condições dos trabalhadores de plataforma — pano de fundo a monitorar para o enquadramento e o discurso de captação da DM.","url":"https://oxadrezdapolitica.com.br/dr-george-morais-projeta-inclusao-para-motoristas-e-entregadores-por-aplicativo/","signals":["regulacao","captacao"]}]},"weekly":{"weekOf":"09/06 – 15/06/2026","count":8,"articles":[{"source":"55 Content","editoria":"Entrevista · Negócios","title":"Resenha Car: app do interior de MG cobra 15% do motorista, ticket médio R$14 e mínima de R$20,99 na madrugada","summary":"App regional nascido em Paraopeba (interior MG) opera com modelo de comissão (15%), não mensalidade, com ticket médio baixo. Prova viva de que naming com 'Car' funciona no interior quando ancorado em proximidade/comunidade ('Resenha') — e que comissão enxuta é viável como alternativa à mensalidade dos rivais locais. Benchmark direto para naming e modelo da DM.","url":"https://55content.com.br/entrevista/com-ticket-medio-de-r-14-resenha-car-cobra-15-dos-motoristas-de-app-e-tem-corrida-minima-de-r-2099-na-madrugada/","signals":["naming","modelo","concorrencia","interior"]},{"source":"CreativosBR / 99","editoria":"Mercado · Mobilidade","title":"99 lança campanha para consolidar 'SuperApp' entre motoristas e testa 99Compras no ABC Paulista","summary":"A 99 reforça sua identidade de SuperApp e começa a testar o 99Compras (entrega de itens do dia a dia dentro do app). É exatamente a tese da DM — vertical plugada numa base existente — sendo executada pela líder. Sinal de que a janela de 'app único de serviços locais' está fechando rápido; a DM precisa ocupar o interior antes que o SuperApp da 99 chegue lá.","url":"https://creativosbr.com.br/99-lanca-campanha-para-consolida-superapp-entre-motoristas-parceiros/","signals":["concorrencia","modelo"]},{"source":"Jornal do Brás","editoria":"Economia · Mobilidade","title":"Usuários da 99 crescem 15% em um ano e chegam a mais de 60 milhões no Brasil","summary":"Base da 99 cresce e estrutura interna se expande (+200% em contratações 2024→2025). A líder está consolidando, não desacelerando — qualquer entrante regional disputa um mercado em que o incumbente investe pesado. Reforça que a vantagem da DM precisa vir da base própria e da proximidade local, não de preço isolado.","url":"https://jornaldobras.com.br/noticia/125717/usuarios-da-99-crescem-15-em-um-ano-e-chegam-a-mais-de-60-milhoes-no-brasil","signals":["concorrencia","modelo"]},{"source":"Google Play / Garupa","editoria":"Mercado · Concorrência","title":"Garupa avança como 'maior app 100% brasileiro' com taxa zero ao motorista e assinatura de R$4,99/mês ao usuário","summary":"Garupa combina taxa zero para o motorista (todo o valor da corrida) com uma assinatura barata para o usuário — território verbal neutro, sem conotação de preço e que acomoda carro e moto. Concorrente direto no modelo 'mensalidade/assinatura' que a DM avalia. O naming 'Garupa' é exatamente o tipo de saída que evita o flanco 'Much Car = Muito Caro'.","url":"https://play.google.com/store/apps/details?id=co.garupa.driver","signals":["naming","modelo","captacao","concorrencia"]},{"source":"Gov.br · Secretaria-Geral","editoria":"Governo · Mobilidade Produtiva","title":"Governo lança Move Brasil Entregadores e MotoApp para compra de motos e bicicletas fabricadas no Brasil","summary":"Nova frente do Move Brasil subsidia o ativo de trabalho de entregadores e motoristas de moto-app. Junto ao crédito para carros, o Estado está baixando o custo de entrada do motorista — amplia o pool, mas eleva expectativas e poder de barganha. Pesa direto na estratégia de captação e na decisão de incluir corrida de moto na vertical DM.","url":"https://www.gov.br/secretariageral/pt-br/noticias/2026/junho/governo-do-brasil-lanca-move-brasil-entregadores-e-motoapp-para-compra-de-motos-e-bicicletas-fabricadas-no-brasil","signals":["captacao","modelo","regulacao"]},{"source":"RFI Brasil","editoria":"Internacional · Trabalho","title":"OIT aprova primeiro tratado global sobre trabalho em plataformas; 2 milhões de brasileiros podem se beneficiar","summary":"A OIT adotou o primeiro tratado internacional para proteger trabalhadores de aplicativos. Sinaliza pressão crescente por formalização, direitos e seguros — fator de custo e de enquadramento jurídico para qualquer operação de mobilidade nova, inclusive a da DM. Captação no interior terá de incorporar discurso de segurança e proteção do motorista.","url":"https://www.rfi.fr/br/europa/20260612-oit-aprova-tratado-global-sobre-aplicativos-2-milh%C3%B5es-de-trabalhadores-poder%C3%A3o-se-beneficiar-no-brasil","signals":["regulacao","captacao"]},{"source":"Vermelho / Agência Brasil","editoria":"Política · Transporte","title":"Lula sanciona novo Marco Legal do Transporte Público Coletivo Urbano","summary":"Nova lei muda financiamento, contratação, qualidade e preço do transporte coletivo. Embora foque no coletivo, redesenha o ambiente regulatório da mobilidade urbana em que o app de corrida opera — contexto a monitorar para o posicionamento da DM frente a poder público municipal nas cidades-piloto.","url":"https://vermelho.org.br/2026/06/15/lula-sanciona-lei-que-muda-as-regras-do-transporte-publico-no-brasil/","signals":["regulacao","modelo"]},{"source":"Record / R7 · G1","editoria":"Segurança · Interior","title":"Onda de violência contra motoristas de app no interior de SP (corridas falsas, sequestro e latrocínio)","summary":"Múltiplos casos na semana (Campinas, Rio Preto): sequestro em corrida falsa e motorista morto em latrocínio. Insegurança é barreira real de captação no interior e abre espaço para diferenciação por verificação/segurança — argumento que a DM pode usar para atrair motoristas que já rodam em apps sem proteção robusta.","url":"https://record.r7.com/balanco-geral-manha/video/motorista-de-aplicativo-e-sequestrado-e-espancado-durante-corrida-falsa-em-campinas-sp-11062026/","signals":["interior","captacao"]}],"analysis":{"naming":"A semana fortalece duas conclusões sobre o território de marca para o interior. Primeira: 'Car' não é necessariamente fatal. O Resenha Car (interior de MG) opera com 'Car' no nome sem evocar 'caro' porque ancora a marca em proximidade e comunidade ('resenha'). Ou seja, o problema do 'Much Car = Muito Caro' não é a palavra 'Car' isolada — é a colagem com 'Much/Muito'. Segunda, e mais forte: os modelos vencedores no interior usam território verbal neutro que acomoda carro E moto. O Garupa — que se posiciona como 'maior app 100% brasileiro' — é o melhor benchmark da semana: nome neutro, sem conotação de preço, que funciona para carro e moto e ainda carrega brasilidade. Recomendação reforçada: fugir do eixo 'Car/caro', priorizar um nome curto, regional e neutro que não trave a corrida de moto. Movimento que muda o jogo: a 99 está consolidando publicamente a marca 'SuperApp' (com 99Compras em teste) — a tese de 'app único de serviços' que a DM defende já está sendo apropriada pela líder. A janela de posicionamento como 'o app de tudo da sua cidade' está se fechando; a DM precisa cravar esse território no interior antes que o SuperApp da 99 desça para lá.","captacao":"Duas mudanças estruturais na semana. (1) O Estado está subsidiando o ativo de trabalho do motorista: Move Brasil (carros, ~40 modelos com desconto) somado ao novo Move Brasil Entregadores e MotoApp (crédito para motos/bikes nacionais). Isso amplia o pool de motoristas, mas também eleva expectativa e poder de barganha — motorista com custo de veículo subsidiado é mais seletivo sobre para quem roda. (2) Pressão de formalização subindo: a OIT aprovou o primeiro tratado global de trabalho em plataformas (2 mi de brasileiros) e o novo Marco Legal do Transporte Público foi sancionado. Conclusão direta: no interior, a arma de captação é economia líquida do motorista, não marca. Rota 77, Pop69 e Garupa já disputam nesse eixo (100% da corrida / taxa zero / mensalidade). Para tirar motorista que já roda em concorrente local, a DM tem de ganhar em dois vetores simultâneos: (a) bater no líquido — comissão baixa/zero ou mensalidade transparente, e o Resenha Car prova que 15% de comissão é viável no interior; e (b) entregar o que o rival white-label não tem — a base instalada da DM como demanda garantida no dia 1. Risco novo e concreto: a onda de violência contra motoristas no interior de SP (corridas falsas, sequestro, latrocínio) transforma segurança/verificação de 'diferencial bonito' em critério de escolha do motorista. Quem oferecer verificação de passageiro e protocolo de segurança leva motorista.","tese":"A tese de 10% da base ativa em Cáceres pedindo corrida no 1º mês é AGRESSIVA — a semana pesa mais contra do que a favor. A favor (1 sinal forte): a 99 provou que cross-sell de mobilidade dentro de um app de base existente funciona em escala (SuperApp + 99Compras), o que valida estruturalmente a tese 'plugar mobilidade na base DM'. Contra (dois sinais duros): primeiro, o interior NÃO é greenfield — Rota 77, Pop69, Garupa e Resenha Car já operam com bases de motoristas fidelizadas e preço agressivo; a restrição não é demanda, é liquidez de oferta (motorista online suficiente para tempo de espera competitivo no dia 1). Segundo, não há nenhuma evidência nesta semana de que usuário de delivery converte para corrida na casa de 10% em 30 dias — adjacência de categoria não é equivalência de comportamento. Leitura honesta e crítica: 10% no 1º mês confunde awareness com conversão e ignora o gargalo real, que é densidade de motorista. Se a DM não garantir oferta suficiente em Cáceres desde o lançamento, a demanda dos 10% evapora após a primeira experiência de espera longa. Recomendação: tratar 10% como meta de 90 dias, não de mês 1; instrumentar o lançamento por liquidez de oferta primeiro (quantos motoristas online por hora), e só então acionar a base de demanda."}}};

function signalChips(signals) {
  return signals.map(s => {
    const m = SIGNAL_META[s] || { label: s, cls: '' };
    return `<span class="signal ${m.cls}">${m.label}</span>`;
  }).join('');
}

function renderCard(a) {
  return `
    <div class="card">
      <div class="card-header">
        <span class="source">${a.source}</span>
        <span class="dot">·</span>
        <span class="editoria">${a.editoria}</span>
      </div>
      <div class="card-body">
        <h2>${a.title}</h2>
        <p>${a.summary}</p>
      </div>
      <div class="card-footer">
        <div class="signals">${signalChips(a.signals)}</div>
        <a class="read-link" href="${a.url}" target="_blank">Ler matéria →</a>
      </div>
    </div>`;
}

function renderDaily() {
  const d = STATE.daily;
  if (!d || !d.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📭</div>
      <p>Nenhum clipping diário disponível ainda.</p>
    </div>`;
  }
  const alertClass = d.alert.toLowerCase().includes('nenhuma') ? '' : 'green';
  return `
    <div class="count-bar">
      <span>📰</span>
      <strong>${d.count} matérias</strong><span>&nbsp;·&nbsp;${d.dayOfWeek}, ${d.date}</span>
    </div>
    ${d.alert ? `<div class="alert-bar ${alertClass}">⚠️ ${d.alert}</div>` : ''}
    <div class="cards">${d.articles.map(renderCard).join('')}</div>`;
}

function renderWeekly() {
  const w = STATE.weekly;
  if (!w || !w.count) {
    return `<div class="empty-state">
      <div style="font-size:32px">📅</div>
      <p>A análise semanal será gerada na próxima segunda-feira às 7h.</p>
    </div>`;
  }
  const hasAnalysis = w.analysis && (w.analysis.naming || w.analysis.captacao || w.analysis.tese);
  return `
    <div class="count-bar">
      <span>📊</span>
      <strong>${w.count} matérias monitoradas</strong><span>&nbsp;·&nbsp;Semana de ${w.weekOf}</span>
    </div>
    ${hasAnalysis ? `
      <div class="week-label">📊 Análise Crítica da Semana</div>
      ${w.analysis.naming ? `<div class="analysis-block"><h3>🏷️ Naming / Posicionamento</h3><p>${w.analysis.naming}</p></div>` : ''}
      ${w.analysis.captacao ? `<div class="analysis-block"><h3>🚗 Captação de Motorista</h3><p>${w.analysis.captacao}</p></div>` : ''}
      ${w.analysis.tese ? `<div class="analysis-block"><h3>🎯 Dado Crítico — Tese de Conversão de Base</h3><p>${w.analysis.tese}</p></div>` : ''}
      <div class="week-label">🗞️ Matérias da Semana</div>
    ` : ''}
    <div class="cards">${w.articles.map(renderCard).join('')}</div>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'daily') || (i === 1 && tab === 'weekly'));
  });
  document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
  document.getElementById('tab-weekly').classList.toggle('active', tab === 'weekly');
}

// Render
document.getElementById('header-date').textContent = STATE.daily.date || '';
document.getElementById('tab-daily').innerHTML = renderDaily();
document.getElementById('tab-weekly').innerHTML = renderWeekly();

// Restore last tab from localStorage
const lastTab = localStorage.getItem('dm-clipping-tab') || 'daily';
switchTab(lastTab);
document.querySelectorAll('.tab-btn').forEach((b, i) => {
  b.addEventListener('click', () => {
    localStorage.setItem('dm-clipping-tab', i === 0 ? 'daily' : 'weekly');
  });
});
</script>
</body>
</html>
